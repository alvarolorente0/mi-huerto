<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA DE RIEGO - MKR1000</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            background-color: #000000; 
            color: #00d4ff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .card { 
            background: #0a0a0a; 
            border: 2px solid #00d4ff; 
            border-radius: 12px; 
            padding: 20px; 
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }
        h2 { border-bottom: 1px solid #00d4ff; padding-bottom: 10px; text-transform: uppercase; }
        
        .btn { 
            padding: 10px 20px; 
            cursor: pointer; 
            background: transparent; 
            border: 1px solid #00d4ff; 
            color: #00d4ff;
            border-radius: 5px;
            margin: 5px;
            transition: all 0.3s;
        }
        .btn:hover { background: #00d4ff; color: #000; box-shadow: 0 0 10px #00d4ff; }
        .btn.active { background: #00d4ff; color: #000; }

        input, select {
            background: #111;
            border: 1px solid #00d4ff;
            color: #00d4ff;
            padding: 5px;
            border-radius: 4px;
        }
        .prog-item {
            border-left: 3px solid #00d4ff;
            padding: 10px;
            margin: 10px 0;
            background: #111;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Control Manual (ON/OFF/AUTO)</h2>
        <div id="manual-controls">
            </div>
    </div>

    <div class="card">
        <h2>Programas de Riego</h2>
        <div id="listaProgramas"></div>
        <button class="btn" onclick="crearPrograma()">+ AGREGAR PROGRAMA</button>
    </div>

    <div class="card">
        <h2>Historial de Temperatura (24h)</h2>
        <canvas id="tempChart" style="max-height: 300px;"></canvas>
    </div>

<script>
    const broker = 'wss://TU_ID.s1.eu.hivemq.cloud:8884/mqtt';
    const options = { username: 'TU_USUARIO', password: 'TU_PASSWORD' };
    const client = mqtt.connect(broker, options);

    let programas = JSON.parse(localStorage.getItem('riego_progs')) || [];
    let logs = JSON.parse(localStorage.getItem('temp_logs')) || [];

    client.on('connect', () => {
        client.subscribe('jardin/temp_log');
        client.publish('jardin/config', JSON.stringify({sync: Date.now()}));
    });

    client.on('message', (topic, msg) => {
        if(topic === 'jardin/temp_log') updateChart(parseFloat(msg.toString()));
    });

    function sendCommand(pin, mode) {
        // mode: 0=OFF, 1=ON, 2=AUTO
        client.publish('jardin/manual', JSON.stringify({pin: pin, val: mode}));
    }

    function crearPrograma() {
        const nuevo = { id: Date.now(), h: "08:00", v: [6], dias: [1,2,3,4,5], active: true };
        programas.push(nuevo);
        actualizarTodo();
    }

    function borrarPrograma(id) {
        programas = programas.filter(p => p.id !== id);
        actualizarTodo();
    }

    function actualizarTodo() {
        localStorage.setItem('riego_progs', JSON.stringify(programas));
        renderList();
        client.publish('jardin/config', JSON.stringify(programas));
    }

    function renderList() {
        const cont = document.getElementById('listaProgramas');
        cont.innerHTML = programas.map(p => `
            <div class="prog-item">
                Hora: <input type="time" value="${p.h}" onchange="p.h=this.value; actualizarTodo()">
                Válvulas: [6,7,9] 
                <button class="btn" onclick="borrarPrograma(${p.id})">ELIMINAR</button>
            </div>
        `).join('');
    }

    // Configuración de la Gráfica Azul
    const ctx = document.getElementById('tempChart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: logs.map(l => l.t),
            datasets: [{
                label: 'Temperatura °C',
                data: logs.map(l => l.v),
                borderColor: '#00d4ff',
                backgroundColor: 'rgba(0, 212, 255, 0.1)',
                borderWidth: 2,
                pointRadius: 0,
                fill: true
            }]
        },
        options: {
            scales: {
                y: { grid: { color: '#222' }, ticks: { color: '#00d4ff' } },
                x: { grid: { color: '#222' }, ticks: { color: '#00d4ff' } }
            },
            plugins: { legend: { labels: { color: '#00d4ff' } } }
        }
    });

    function updateChart(val) {
        const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        logs.push({t: time, v: val});
        if(logs.length > 48) logs.shift();
        localStorage.setItem('temp_logs', JSON.stringify(logs));
        chart.data.labels = logs.map(l => l.t);
        chart.data.datasets[0].data = logs.map(l => l.v);
        chart.update();
    }

    renderList();
</script>
</body>
</html>
