<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIEGO PRO - MKR1000</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --neon: #00d4ff; --bg: #050505; --card: #121212; --led: #00ffaa; --red: #ff4444; }
        body { background: var(--bg); color: #eee; font-family: 'Segoe UI', sans-serif; padding: 15px; max-width: 800px; margin: auto; }
        .hero-temp { text-align: center; padding: 20px; background: radial-gradient(circle, #1a1a1a 0%, #050505 100%); border: 2px solid var(--neon); border-radius: 20px; margin-bottom: 20px; }
        .temp-val { font-size: 4.5rem; font-weight: 900; color: var(--neon); margin: 5px 0; }
        .card { background: var(--card); border: 1px solid #222; border-radius: 15px; padding: 18px; margin-bottom: 20px; }
        .ev-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
        .ev-item { background: #000; padding: 15px; border-radius: 12px; border: 1px solid #333; text-align: center; }
        .status-led { width: 12px; height: 12px; border-radius: 50%; background: #222; margin: 0 auto 10px; }
        .status-led.on { background: var(--led); box-shadow: 0 0 10px var(--led); }
        .btn-group { display: flex; gap: 4px; margin-top: 12px; }
        .btn-m { flex: 1; padding: 10px 2px; border: 1px solid #333; background: #111; color: #555; border-radius: 6px; cursor: pointer; font-size: 0.7rem; font-weight: bold; }
        .btn-m.active-on { border-color: var(--led); color: var(--led); }
        .btn-m.active-off { border-color: var(--red); color: var(--red); }
        .btn-m.active-auto { border-color: var(--neon); color: var(--neon); }
        .acc-container { border: 1px solid var(--neon); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
        .acc-header { width: 100%; padding: 15px; background: #1a1a1a; color: var(--neon); font-weight: bold; border: none; cursor: pointer; display: flex; justify-content: space-between; }
        .acc-body { display: none; padding: 15px; background: #0c0c0c; border-top: 1px solid #222; }
        .acc-body.open { display: block; }
        .form-new { display: grid; gap: 10px; margin-top: 15px; padding: 15px; background: #111; border-radius: 8px; }
        .day-selector { display: flex; justify-content: space-between; }
        input[type="time"], select { background: #000; border: 1px solid #444; color: white; padding: 8px; border-radius: 5px; }
        .btn-add { background: var(--neon); color: #000; border: none; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .prog-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; background: #1a1a1a; padding: 10px; border-radius: 8px; border: 1px solid #333; }
        .btn-del { background: transparent; border: none; color: var(--red); font-size: 1.1rem; cursor: pointer; font-weight: bold; padding: 5px 10px; }
    </style>
</head>
<body>
    <div class="hero-temp">
        <div id="mqtt-status" style="font-size: 0.7rem; color: var(--red);">DESCONECTADO</div>
        <div class="temp-val"><span id="valTemp">--.-</span>°C</div>
    </div>

    <div class="card">
        <div class="ev-grid" id="ui-valvulas"></div>
    </div>

    <div class="acc-container">
        <button class="acc-header" onclick="document.getElementById('acc-body').classList.toggle('open')">
            <span>📅 PROGRAMACIÓN</span>
            <span id="count-activos">0</span>
        </button>
        <div class="acc-body" id="acc-body">
            <div id="lista-progs"></div>
            <div class="form-new">
                <input type="time" id="in-ini" value="08:00">
                <input type="time" id="in-fin" value="08:30">
                <select id="in-pin"><option value="6">PIN 6</option><option value="7">PIN 7</option><option value="9">PIN 9</option></select>
                <div class="day-selector" id="day-sel">
                    <label><input type="checkbox" value="1">L</label><label><input type="checkbox" value="2">M</label>
                    <label><input type="checkbox" value="3">X</label><label><input type="checkbox" value="4">J</label>
                    <label><input type="checkbox" value="5">V</label><label><input type="checkbox" value="6">S</label>
                    <label><input type="checkbox" value="0">D</label>
                </div>
                <button class="btn-add" onclick="crearProg()">GUARDAR NUEVO HORARIO</button>
            </div>
        </div>
    </div>

            });

        });
