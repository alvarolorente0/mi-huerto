    <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Riego PRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: sans-serif; }
        .card-custom { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .temp-val { font-size: 2.5rem; color: #58a6ff; font-weight: bold; }
        .btn-check-group .btn { font-size: 12px; padding: 5px; }
        .indicator { width: 15px; height: 15px; border-radius: 50%; display: inline-block; background: #30363d; }
        .indicator.on { background: #238636; box-shadow: 0 0 10px #238636; }
        .day-btn { width: 35px; height: 35px; border-radius: 50%; border: 1px solid #30363d; background: none; color: #8b949e; cursor: pointer; }
        .day-btn.active { background: #1f6feb; color: white; border-color: #58a6ff; }
    </style>
</head>
<body class="container py-4">
    <div class="row align-items-center mb-4">
        <div class="col">
            <h2 class="text-white">RiegoSmart <span id="status" class="badge bg-danger fs-6">Desconectado</span></h2>
        </div>
        <div class="col-auto text-center card-custom m-0 py-2">
            <small class="d-block text-muted">TEMPERATURA</small>
            <span class="temp-val" id="txtTemp">--°</span>
        </div>
    </div>

    <div class="row g-3">
        <!-- VÁLVULAS -->
        <div class="col-md-4">
            <div id="ui-valvulas"></div>
            <div class="card-custom mt-3">
                <h6>Gráfica 24h</h6>
                <canvas id="chart"></canvas>
            </div>
        </div>

        <!-- PROGRAMAS -->
        <div class="col-md-8">
            <div class="card-custom">
                <div class="d-flex justify-content-between mb-3">
                    <h5 class="text-white">📅 Programación Semanal</h5>
                    <button class="btn btn-primary btn-sm" onclick="addProg()">+ Nuevo Programa</button>
                </div>
                <div class="accordion" id="progAcc"></div>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            host: "wss://4f497890d218456aa4de0965d267c8e9.s1.eu.hivemq.cloud:8884/mqtt",
            user: "mqtt_user",
            pass: "Mqtt_user1"
        };

        const client = mqtt.connect(CONFIG.host, { username: CONFIG.user, password: CONFIG.pass });
        let programs = JSON.parse(localStorage.getItem('riegopro_db')) || [];
        let history = [];

        client.on('connect', () => {
            document.getElementById('status').className = "badge bg-success fs-6";
            document.getElementById('status').innerText = "Conectado";
            client.subscribe('riego/telemetria');
        });

        client.on('message', (topic, msg) => {
            const data = JSON.parse(msg);
            document.getElementById('txtTemp').innerText = data.t.toFixed(1) + "°";
            data.s.forEach((on, i) => document.getElementById(`ind-${i+1}`).className = on ? 'indicator on' : 'indicator');
            updateChart(data.t);
        });

        function renderValves() {
            const container = document.getElementById('ui-valvulas');
            container.innerHTML = '';
            for(let i=1; i<=3; i++) {
                container.innerHTML += `
                <div class="card-custom">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <strong>EV ${i}</strong>
                        <div id="ind-${i}" class="indicator"></div>
                    </div>
                    <div class="btn-group w-100">
                        <button class="btn btn-outline-secondary btn-sm" onclick="sendMode(${i},0)">OFF</button>
                        <button class="btn btn-outline-success btn-sm" onclick="sendMode(${i},1)">ON</button>
                        <button class="btn btn-outline-primary btn-sm" onclick="sendMode(${i},2)">AUTO</button>
                    </div>
                </div>`;
            }
        }

        function sendMode(v, m) { client.publish('riego/control', JSON.stringify({v:v, modo:m})); }

        function renderPrograms() {
            const acc = document.getElementById('progAcc');
            acc.innerHTML = '';
            programs.forEach((p, i) => {
                acc.innerHTML += `
                <div class="accordion-item bg-transparent border-secondary mb-2">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed bg-dark text-white" data-bs-toggle="collapse" data-bs-target="#p${i}">
                            Prog #${i+1}: ${p.on} a ${p.off}
                        </button>
                    </h2>
                    <div id="p${i}" class="accordion-collapse collapse" data-bs-parent="#progAcc">
                        <div class="accordion-body border-top border-secondary">
                            <div class="mb-3">
                                ${['D','L','M','X','J','V','S'].map((d, dIdx) => `
                                    <button class="day-btn ${p.days.includes(dIdx)?'active':''}" onclick="toggleDay(${i},${dIdx})">${d}</button>
                                `).join('')}
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-6">Inicio: <input type="time" class="form-control form-control-sm" value="${p.on}" onchange="updateP(${i},'on',this.value)"></div>
                                <div class="col-6">Fin: <input type="time" class="form-control form-control-sm" value="${p.off}" onchange="updateP(${i},'off',this.value)"></div>
                            </div>
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    ${[0,1,2].map(vIdx => `
                                        <button class="btn btn-sm ${p.evs[vIdx]?'btn-info':'btn-outline-secondary'}" onclick="toggleEV(${i},${vIdx})">EV ${vIdx+1}</button>
                                    `).join('')}
                                </div>
                                <button class="btn btn-danger btn-sm" onclick="removeP(${i})">🗑</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
            localStorage.setItem('riegopro_db', JSON.stringify(programs));
        }

        function addProg() {
            programs.push({on:"08:00", off:"08:15", days:[1,2,3,4,5], evs:[true,false,false]});
            renderPrograms();
        }
        function updateP(i,k,v){ programs[i][k]=v; renderPrograms(); }
        function toggleDay(i,d){
            const idx = programs[i].days.indexOf(d);
            idx === -1 ? programs[i].days.push(d) : programs[i].days.splice(idx,1);
            renderPrograms();
        }
        function toggleEV(i,v){ programs[i].evs[v]=!programs[i].evs[v]; renderPrograms(); }
        function removeP(i){ programs.splice(i,1); renderPrograms(); }

        // Motor de Horarios (Navegador)
        setInterval(() => {
            const now = new Date();
            const curTime = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');
            const curDay = now.getDay();
            let auto = [false, false, false];

            programs.forEach(p => {
                if(p.days.includes(curDay) && curTime >= p.on && curTime < p.off) {
                    p.evs.forEach((active, idx) => { if(active) auto[idx] = true; });
                }
            });
            if(client.connected) client.publish('riego/control', JSON.stringify({auto_exec: auto}));
        }, 5000);

        // Chart
        const chart = new Chart(document.getElementById('chart'), {
            type: 'line', data: { labels: Array(10).fill(''), datasets: [{data:[], borderColor:'#58a6ff', tension:0.4}] },
            options: { plugins:{legend:{display:false}}, scales:{x:{display:false}} }
        });
        function updateChart(t){
            if(history.length > 10) history.shift();
            history.push(t);
            chart.data.datasets[0].data = history;
            chart.update();
        }

        renderValves();
        renderPrograms();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
