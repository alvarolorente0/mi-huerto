<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huerto Pro v5</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0b0c10; --card: #1c252e; --accent: #38bdf8; --on: #22c55e; --off: #ef4444; --auto: #eab308; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #d1d5db; margin: 0; padding: 15px; text-align: center; }
        .main-temp { font-size: 4rem; font-weight: bold; color: var(--accent); margin: 10px 0; }
        .panel { background: var(--card); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #2d3748; text-align: left; }
        .device-row { display: flex; align-items: center; justify-content: space-between; background: #0f171e; padding: 12px; margin-bottom: 8px; border-radius: 6px; }
        .btn-group button { padding: 10px; border: 1px solid #333; background: #1c252e; color: #666; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button.active { color: white !important; border-color: white; }
        .btn-on.active { background: var(--on); } .btn-off.active { background: var(--off); } .btn-auto.active { background: var(--auto); color: black !important; }
        
        .multi-select { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0; }
        .chip { padding: 8px; background: #1c252e; border: 1px solid #333; border-radius: 4px; cursor: pointer; font-size: 0.8rem; flex: 1; text-align: center; }
        .chip.selected { background: var(--accent); color: black; }
        
        #prog-panel { display: none; }
        .item-prog { background: #0f171e; padding: 12px; border-radius: 6px; margin-top: 8px; border-left: 4px solid #444; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .item-prog.active-prog { border-left-color: var(--on); }
        .actions i { cursor: pointer; margin-left: 15px; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="main-temp" id="temp-val">--°C</div>

    <div class="panel">
        <div class="device-row" id="row-6">
            <span><i class="fas fa-faucet"></i> EV1</span>
            <div class="btn-group">
                <button class="btn-off" onclick="changeMode(6, '0')">OFF</button>
                <button class="btn-auto" onclick="changeMode(6, '2')">AUTO</button>
                <button class="btn-on" onclick="changeMode(6, '1')">ON</button>
            </div>
        </div>
        <div class="device-row" id="row-7">
            <span><i class="fas fa-faucet"></i> EV2</span>
            <div class="btn-group">
                <button class="btn-off" onclick="changeMode(7, '0')">OFF</button>
                <button class="btn-auto" onclick="changeMode(7, '2')">AUTO</button>
                <button class="btn-on" onclick="changeMode(7, '1')">ON</button>
            </div>
        </div>
        <div class="device-row" id="row-9">
            <span><i class="fas fa-seedling"></i> ABNO</span>
            <div class="btn-group">
                <button class="btn-off" onclick="changeMode(9, '0')">OFF</button>
                <button class="btn-auto" onclick="changeMode(9, '2')">AUTO</button>
                <button class="btn-on" onclick="changeMode(9, '1')">ON</button>
            </div>
        </div>
    </div>

    <button class="panel" style="width:100%; color:var(--accent); cursor:pointer; font-weight:bold" onclick="toggleProgPanel()">+ GESTIONAR PROGRAMAS</button>

    <div id="prog-panel" class="panel">
        <div class="multi-select" id="days-picker">
            <div class="chip" data-val="1">Lu</div><div class="chip" data-val="2">Ma</div><div class="chip" data-val="3">Mi</div>
            <div class="chip" data-val="4">Ju</div><div class="chip" data-val="5">Vi</div><div class="chip" data-val="6">Sa</div><div class="chip" data-val="0">Do</div>
        </div>
        <div class="multi-select" id="pins-picker">
            <div class="chip" data-val="6">EV1</div><div class="chip" data-val="7">EV2</div><div class="chip" data-val="9">ABNO</div>
        </div>
        <input type="time" id="t-on" style="padding:8px;"> <input type="time" id="t-off" style="padding:8px;">
        <button onclick="saveNewProg()" style="width:100%; background:var(--accent); border:none; padding:12px; font-weight:bold; margin-top:10px;">AÑADIR</button>
        <div id="lista-progs" style="margin-top:15px;"></div>
    </div>

    <div class="panel"><canvas id="tempChart"></canvas></div>

<script>
    const TOPIC = "CVH_HUERTO";
    let programas = JSON.parse(localStorage.getItem('h_progs')) || [];
    let estados = JSON.parse(localStorage.getItem('h_states')) || { "6":"0", "7":"0", "9":"0" };
    let historico = JSON.parse(localStorage.getItem('h_chart')) || Array(48).fill(null);

    const client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "/mqtt", "u_" + Math.random());

    client.connect({ useSSL: true, onSuccess: () => {
        client.subscribe(TOPIC + "/telemetria/temp");
        updateButtonsUI();
        renderProgs();
        initChart();
    }});

    function changeMode(pin, val) {
        estados[pin] = val;
        localStorage.setItem('h_states', JSON.stringify(estados));
        const msg = new Paho.MQTT.Message(val);
        msg.destinationName = `${TOPIC}/control/${pin}`;
        msg.retained = true;
        client.send(msg);
        updateButtonsUI();
    }

    function updateButtonsUI() {
        [6, 7, 9].forEach(pin => {
            const btns = document.getElementById(`row-${pin}`).querySelectorAll('button');
            btns.forEach(b => b.classList.remove('active'));
            const s = estados[pin];
            if(s==="0") btns[0].classList.add('active'); else if(s==="2") btns[1].classList.add('active'); else if(s==="1") btns[2].classList.add('active');
        });
    }

    function saveNewProg() {
        const days = Array.from(document.querySelectorAll('#days-picker .selected')).map(c => parseInt(c.dataset.val));
        const pins = Array.from(document.querySelectorAll('#pins-picker .selected')).map(c => parseInt(c.dataset.val));
        const on = document.getElementById('t-on').value;
        const off = document.getElementById('t-off').value;

        if(!days.length || !pins.length || !on || !off) return alert("Completa todos los campos");

        programas.push({ id: Date.now(), days, pins, on, off, enabled: true });
        sync();
    }

    function toggleProg(id) {
        const p = programas.find(x => x.id === id);
        p.enabled = !p.enabled;
        sync();
    }

    function delProg(id) {
        programas = programas.filter(x => x.id !== id);
        sync();
    }

    function sync() {
        localStorage.setItem('h_progs', JSON.stringify(programas));
        renderProgs();
        const msg = new Paho.MQTT.Message(JSON.stringify(programas));
        msg.destinationName = TOPIC + "/config/progs";
        msg.retained = true;
        client.send(msg);
    }

    function renderProgs() {
        const div = document.getElementById('lista-progs');
        div.innerHTML = "";
        programas.forEach(p => {
            div.innerHTML += `
                <div class="item-prog ${p.enabled ? 'active-prog' : ''}">
                    <span>Pins: ${p.pins.join(',')} | ${p.on}-${p.off}</span>
                    <div class="actions">
                        <i class="fas ${p.enabled ? 'fa-toggle-on' : 'fa-toggle-off'}" onclick="toggleProg(${p.id})" style="color:${p.enabled?'var(--on)':'#555'}"></i>
                        <i class="fas fa-trash" onclick="delProg(${p.id})" style="color:var(--off)"></i>
                    </div>
                </div>`;
        });
    }

    function initChart() {
        const labels = [];
        for(let i=0; i<24; i++) { labels.push(i+":00"); labels.push(i+":30"); }
        chart = new Chart(document.getElementById('tempChart'), {
            type: 'line',
            data: { labels: labels, datasets: [{ label: 'Temp 24h', data: historico, borderColor: '#38bdf8', tension: 0.4 }] }
        });
    }

    client.onMessageArrived = (msg) => {
        if(msg.destinationName.includes("temp")) {
            const t = parseFloat(msg.payloadString);
            document.getElementById('temp-val').innerText = t.toFixed(1) + "°C";
            const now = new Date();
            const min = now.getMinutes();
            if(min === 0 || min === 30) {
                const idx = now.getHours() * 2 + (min === 30 ? 1 : 0);
                historico[idx] = t;
                localStorage.setItem('h_chart', JSON.stringify(historico));
                chart.update();
            }
        }
    };

    function toggleProgPanel() {
        const p = document.getElementById('prog-panel');
        p.style.display = p.style.display === 'block' ? 'none' : 'block';
    }

    document.querySelectorAll('.chip').forEach(c => c.onclick = () => c.classList.toggle('selected'));
</script>
</body>
</html>
