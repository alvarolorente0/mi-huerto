<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Irrigation Dashboard PRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        body { background-color: #050505; color: #fff; font-family: 'Inter', sans-serif; }
        .card-glass { background: #121212; border: 1px solid #2a2a2a; border-radius: 12px; padding: 20px; }
        .neon-btn { border: 1px solid #00f2ff; color: #00f2ff; background: transparent; transition: 0.3s; width: 100%; }
        .neon-btn.active { background: #00f2ff; color: #000; box-shadow: 0 0 15px #00f2ff; }
        .accordion-item { background: #1a1a1a; border-color: #333; }
        .accordion-button { background: #1a1a1a; color: white; }
        .accordion-button:not(.collapsed) { background: #222; color: #00f2ff; }
    </style>
</head>
<body class="container py-4">
    <h1 class="text-center mb-5 fw-bold" style="letter-spacing: 2px;">RIEGOSMART <span class="text-info">MKR</span></h1>

    <div class="row g-4">
        <!-- Gráfica de 24h -->
        <div class="col-lg-8">
            <div class="card-glass h-100">
                <h5 class="mb-4">Temperatura (Últimas 24 Horas)</h5>
                <canvas id="tempChart" height="150"></canvas>
            </div>
        </div>
        
        <!-- Control Manual -->
        <div class="col-lg-4">
            <div class="card-glass h-100">
                <h5 class="mb-4">Manual Override</h5>
                <div class="d-grid gap-3">
                    <button id="v1" onclick="toggleV(1)" class="btn neon-btn">VÁLVULA 1</button>
                    <button id="v2" onclick="toggleV(2)" class="btn neon-btn">VÁLVULA 2</button>
                    <button id="v3" onclick="toggleV(3)" class="btn neon-btn">VÁLVULA 3</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Acordeón de Programas -->
    <div class="card-glass mt-4">
        <div class="d-flex justify-content-between mb-3">
            <h5>Programas de Riego</h5>
            <button class="btn btn-outline-info btn-sm" onclick="addProgram()">+ Crear Nuevo</button>
        </div>
        <div class="accordion" id="progAccordion"></div>
    </div>

    <script>
        const BROKER = "wss://4f497890d218456aa4de0965d267c8e9.s1.eu.hivemq.cloud:8884/mqtt";
        const client = mqtt.connect(BROKER, { username: 'TU_USUARIO', password: 'Mqtt_pass1' });

        let historyData = [];

        client.on('message', (topic, msg) => {
            if(topic === 'riego/temp') {
                const temp = JSON.parse(msg).t;
                updateChart(temp);
            }
        });
        client.subscribe('riego/temp');

        function toggleV(n) {
            const btn = document.getElementById(`v${n}`);
            const state = !btn.classList.contains('active');
            btn.classList.toggle('active');
            client.publish('riego/control', JSON.stringify({v: n, on: state}));
        }

        // Gráfica con Chart.js
        const ctx = document.getElementById('tempChart');
        const chart = new Chart(ctx, {
            type: 'line',
            data: { labels: Array(24).fill(''), datasets: [{ label: 'Temp °C', data: [], borderColor: '#00f2ff', tension: 0.3 }] },
            options: { scales: { y: { grid: { color: '#222' } }, x: { display: false } } }
        });

        function updateChart(val) {
            if(historyData.length > 24) historyData.shift();
            historyData.push(val);
            chart.data.datasets[0].data = historyData;
            chart.update();
        }

        function addProgram() {
            const id = Date.now();
            const html = `
                <div class="accordion-item" id="item-${id}">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#c-${id}">
                            Programa Personalizado
                        </button>
                    </h2>
                    <div id="c-${id}" class="accordion-collapse collapse">
                        <div class="accordion-body">
                            Válvula: <select class="bg-dark text-white"><option>1</option><option>2</option><option>3</option></select>
                            Inicio: <input type="time" class="bg-dark text-white border-secondary">
                            <button class="btn btn-danger btn-sm mt-2" onclick="document.getElementById('item-${id}').remove()">Eliminar</button>
                        </div>
                    </div>
                </div>`;
            document.getElementById('progAccordion').insertAdjacentHTML('beforeend', html);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
