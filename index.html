<!DOCTYPE HTML>
<html>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Riego Smart Cloud</title>
    <script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body{font-family:sans-serif; background:#0d1117; color:#c9d1d9; margin:0; padding:10px; text-align:center;}
        .container{max-width:900px; margin:auto; display:flex; flex-wrap:wrap; justify-content:center; gap:12px;}
        .card{background:#161b22; border:1px solid #30363d; border-radius:12px; padding:12px; flex:1 1 280px;}
        .btn-group{display:flex; gap:4px; margin-top:8px;}
        .btn{flex:1; padding:10px 2px; border-radius:6px; border:none; cursor:pointer; background:#21262d; color:white; font-weight:bold; font-size:12px;}
        .active{background:#238636;}
        .on{color:#3fb950;} .off{color:#f85149;}
        details{width:100%; background:#161b22; border:1px solid #30363d; border-radius:12px; text-align:left;}
        summary{padding:12px; cursor:pointer; font-weight:bold;}
        .chart-card{width:100%; height:220px;}
        input[type=time], input[type=password]{background:#0d1117; color:white; border:1px solid #30363d; padding:8px; border-radius:5px; text-align:center;}
        
        #login-screen {
            max-width: 320px; margin: 100px auto; padding: 25px; 
            background: #161b22; border: 1px solid #30363d; border-radius: 12px;
        }
        #app-content { display: none; }
        .error-msg { color: #f85149; font-size: 13px; margin-top: 10px; display: none; }
        .btn-save { background: #238636; color: white; width: calc(100% - 20px); margin: 5px 10px 15px 10px; font-size: 14px; padding: 12px; border-radius: 8px;}
        .btn-save:not(:disabled):hover { background: #2ea043; }
        .btn-save:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="login-screen">
    <h2>🌱 Riego Cloud</h2>
    <p style="color: #8b949e; font-size: 14px;">Introduce la contraseña de acceso</p>
    <input type="password" id="passInput" placeholder="••••" maxlength="8" onkeydown="if(event.key==='Enter') verificarPassword()"><br><br>
    <button class="btn active" style="padding: 10px 20px; flex: none; width: 100%;" onclick="verificarPassword()">INGRESAR</button>
    <div id="error" class="error-msg">⚠️ Contraseña incorrecta</div>
</div>

<div id="app-content">
    <h2>🌱 RIEGO CLOUD</h2>
    <p>RELOJ: <span id='hora'>--:--:--</span> | <span id='temp' class='on'>--</span>°C</p>
    <div id="status" style="font-size: 10px; color: #8b949e;">Iniciando conexión con Shiftr.io...</div>

    <div class='container'>
        <details open>
            <summary>📅 CONFIGURACIÓN DE PROGRAMAS</summary>
            <div id='listaProg' style='padding:10px;'>Cargando programas...</div>
            <button class='btn' style='margin:10px 10px 5px 10px; width:calc(100% - 20px); background:#30363d;' onclick='addP()'>+ AÑADIR PROGRAMA</button>
            <button id="btnGuardar" class='btn btn-save' onclick='enviarProgsAlHardware()' disabled>💾 GUARDAR CAMBIOS EN LA NUBE</button>
        </details>
        <div id='valvulas' style='width:100%; display:flex; flex-wrap:wrap; gap:12px;'></div>
        <div class='card chart-card'><strong>Historial 24h</strong><canvas id='myChart'></canvas></div>
    </div>
</div>

<script>
    const CLAVE_CORRECTA = "1234";
    let progs = []; 
    let editado = false; // Controla si hay cambios pendientes por guardar

    function verificarPassword() {
        const input = document.getElementById('passInput').value;
        if (input === CLAVE_CORRECTA) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            conectarMQTT();
        } else {
            document.getElementById('error').style.display = 'block';
            document.getElementById('passInput').value = '';
        }
    }

    let mqttClient;
    function conectarMQTT() {
        mqttClient = mqtt.connect('wss://public:public@public.cloud.shiftr.io', {
          clientId: 'web-cvh-' + Math.random().toString(16).substr(2, 4)
        });
        
        mqttClient.on('connect', () => {
            document.getElementById('status').innerHTML = "🟢 CONECTADO. SINCRONIZANDO...";
            document.getElementById('status').style.color = "#3fb950";
            mqttClient.subscribe('CVH/riego/data');
            mqttClient.subscribe('CVH/riego/progs'); 
            
            setTimeout(() => { enviarComando("GET_PROGS"); }, 1000);
        });

        mqttClient.on('message', (topic, message) => {
            if(topic === 'CVH/riego/data') up(message.toString());
            if(topic === 'CVH/riego/progs') {
                // Solo aceptamos la lista remota si nosotros no estamos editando activamente
                if(!editado) {
                    procesarProgramasRemotos(message.toString());
                }
            }
        });

        mqttClient.on('error', (err) => {
            document.getElementById('status').innerHTML = "🔴 ERROR DE CONEXIÓN";
            document.getElementById('status').style.color = "#f85149";
        });
    }

    const ctx = document.getElementById('myChart').getContext('2d');
    const myChart = new Chart(ctx, { type: 'line', data: { labels: Array.from({length: 24}, (_, i) => i+'h'), datasets: [{ data: [], borderColor: '#58a6ff', tension: 0.4, fill: true, backgroundColor: 'rgba(88, 166, 255, 0.1)', pointRadius:1 }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { ticks:{font:{size:9}}, grid: {color:'#30363d'} }, x: { ticks:{font:{size:9}}, grid: {display:false} } }, plugins: { legend: {display:false} } } });

    function up(data){
        let p = data.split('|');
        if(p.length < 8) return;
        document.getElementById('temp').innerHTML = p[0];
        document.getElementById('hora').innerHTML = p[7];
        if(p[8]){ myChart.data.datasets[0].data = p[8].split(',').map(Number); myChart.update('none'); }
        
        let vH=''; 
        for(let i=1;i<=3;i++){
            vH+=`<div class='card'><b>EV ${i}</b> <span class='${p[i]=='1'?'on':'off'}' style='float:right; font-size:12px'>${p[i]=='1'?'● ON':'○ OFF'}</span><div class='btn-group'>`;
            [0,1,2].forEach(m=>{
                vH+=`<button class='btn ${p[i+3]==m?'active':''}' onclick='enviarComando("SET_M:${i}:${m}")'>${m==0?'OFF':m==1?'ON':'AUTO'}</button>`;
            });
            vH+='</div></div>';
        }
        document.getElementById('valvulas').innerHTML = vH;
    }

    function enviarComando(cmd) {
        if(mqttClient && mqttClient.connected) mqttClient.publish('CVH/riego/cmd', cmd);
    }

    function enviarProgsAlHardware() {
        if(!mqttClient || !mqttClient.connected) return;
        let str = "SAVE_PROGS|";
        progs.forEach(p => {
            let evsBin = p.evs.map(v => v ? '1' : '0').join('');
            let diasBin = Array.from({length:7}, (_,i) => p.days.includes(i) ? '1' : '0').join('');
            str += `${p.en?'1':'0'},${p.on},${p.off},${evsBin},${diasBin};`;
        });
        mqttClient.publish('CVH/riego/cmd', str);
        
        // Cambios guardados con éxito
        marcarCambios(false);
        document.getElementById('status').innerHTML = "🟢 CAMBIOS GUARDADOS EN LA NUBE";
        setTimeout(() => { document.getElementById('status').innerHTML = "🟢 CONECTADO"; }, 3000);
    }

    function procesarProgramasRemotos(data) {
        if(!data || data === "NONE") { progs = []; renderP(); return; }
        let lista = data.split(';');
        progs = [];
        lista.forEach(item => {
            if(!item) return;
            let tokens = item.split(',');
            if(tokens.length < 5) return;
            
            let evs = tokens[3].split('').map(x => x === '1');
            let days = [];
            tokens[4].split('').forEach((v, i) => { if(v === '1') days.push(i); });
            
            progs.push({ en: tokens[0] === '1', on: tokens[1], off: tokens[2], evs: evs, days: days });
        });
        renderP();
    }

    function tick(){
        if(document.getElementById('app-content').style.display !== 'block') return;
        let hStr = document.getElementById('hora').innerHTML;
        if(hStr == '--:--:--' || progs.length === 0) return;
        
        let cur = hStr.substring(0,5);
        let curD = new Date().getDay();
        let ex = [0,0,0];
        progs.forEach(p => {
            if(p.en && p.days.includes(curD) && cur >= p.on && cur < p.off){
                p.evs.forEach((v, idx) => { if(v) ex[idx]=1; });
            }
        });
        enviarComando(`AUTO:${ex[0]}:${ex[1]}:${ex[2]}`);
    }

    setInterval(tick, 5000);

    function marcarCambios(estado) {
        editado = estado;
        const btn = document.getElementById('btnGuardar');
        btn.disabled = !estado;
        if(estado) {
            btn.innerHTML = "⚠️ GUARDAR CAMBIOS PENDIENTES";
            document.getElementById('status').innerHTML = "🟡 TIENES CAMBIOS SIN GUARDAR";
        } else {
            btn.innerHTML = "💾 GUARDAR CAMBIOS EN LA NUBE";
        }
    }

    function addP(){ 
        if(progs.length>=5) return; 
        progs.push({on:'08:00',off:'08:30',evs:[true,false,false],days:[1,2,3,4,5],en:true}); 
        marcarCambios(true);
        renderP(); 
    }
    
    function renderP(){ 
        let h=''; 
        if(progs.length === 0) h = "<p style='color:#8b949e'>No hay programas configurados.</p>";
        progs.forEach((p,i)=>{ 
            h+=`<div style='border-bottom:1px solid #333;padding:12px 0;'><b>P${i+1}</b> <input type='checkbox' ${p.en?'checked':''} onchange='progs[${i}].en=this.checked;marcarCambios(true);renderP()'> | <input type='time' value='${p.on}' onchange='progs[${i}].on=this.value;marcarCambios(true);renderP()'> a <input type='time' value='${p.off}' onchange='progs[${i}].off=this.value;marcarCambios(true);renderP()'><br><div class='btn-group'>`; 
            ['D','L','M','X','J','V','S'].forEach((d,idx)=>{ h+=`<button class='btn day-btn ${p.days.includes(idx)?'active':''}' onclick='tglDay(${i},${idx})'>${d}</button>`; }); 
            h+=`</div><div class='btn-group'>`; 
            p.evs.forEach((v,vidx)=>{ h+=`<button class='btn ${v?'active':''}' onclick='progs[${i}].evs[vidx]=!progs[${i}].evs[vidx];marcarCambios(true);renderP()'>EV${vidx+1}</button>`; }); 
            h+=`<button class='btn' style='background:#f85149;flex:0.5' onclick='progs.splice(${i},1);marcarCambios(true);renderP()'>🗑</button></div></div>`; 
        }); 
        document.getElementById('listaProg').innerHTML=h; 
    }
    
    function tglDay(p, d){ 
        let pos=progs[p].days.indexOf(d); 
        if(pos>-1) progs[p].days.splice(pos,1); 
        else progs[p].days.push(d); 
        marcarCambios(true);
        renderP(); 
    }
</script>
</body>
</html>
