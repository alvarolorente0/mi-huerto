<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Huerto MKR1000</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0b0c10; --card: #1c252e; --accent: #38bdf8; --on: #22c55e; --off: #ef4444; --auto: #eab308; }
        body { font-family: sans-serif; background: var(--bg); color: #d1d5db; margin: 0; padding: 15px; }
        .panel { background: var(--card); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #2d3748; }
        .device-row { display: flex; align-items: center; justify-content: space-between; background: #0f171e; padding: 10px; margin-bottom: 5px; border-radius: 4px; }
        .btn-group button { padding: 8px 12px; border: 1px solid #444; background: #1c252e; color: #777; cursor: pointer; }
        button.active.btn-on { background: var(--on); color: white; }
        button.active.btn-off { background: var(--off); color: white; }
        button.active.btn-auto { background: var(--auto); color: black; }
        #status { font-size: 0.7rem; color: var(--accent); margin-bottom: 10px; }
        .hidden { display: none; }
        input, select { background: #0f171e; border: 1px solid #333; color: white; padding: 5px; margin: 5px 0; width: 100%; }
    </style>
</head>
<body>

    <div id="status">Conectando MKR1000...</div>

    <!-- CONTROL MANUAL -->
    <div class="panel">
        <h3 style="margin-top:0"><i class="fas fa- power-off"></i> Control Manual</h3>
        <div class="device-row">
            <span>EV1 (Pin 6)</span>
            <div class="btn-group" id="g-6">
                <button class="btn-off" onclick="sendMQTT(6, '0')">OFF</button>
                <button class="btn-auto" onclick="sendMQTT(6, '2')">AUTO</button>
                <button class="btn-on" onclick="sendMQTT(6, '1')">ON</button>
            </div>
        </div>
        <div class="device-row">
            <span>EV2 (Pin 7)</span>
            <div class="btn-group" id="g-7">
                <button class="btn-off" onclick="sendMQTT(7, '0')">OFF</button>
                <button class="btn-auto" onclick="sendMQTT(7, '2')">AUTO</button>
                <button class="btn-on" onclick="sendMQTT(7, '1')">ON</button>
            </div>
        </div>
        <div class="device-row">
            <span>ABNO (Pin 9)</span>
            <div class="btn-group" id="g-9">
                <button class="btn-off" onclick="sendMQTT(9, '0')">OFF</button>
                <button class="btn-auto" onclick="sendMQTT(9, '2')">AUTO</button>
                <button class="btn-on" onclick="sendMQTT(9, '1')">ON</button>
            </div>
        </div>
    </div>

    <!-- PROGRAMADOR DESPLEGABLE -->
    <div class="panel">
        <h3 onclick="document.getElementById('prog-form').classList.toggle('hidden')" style="cursor:pointer">
            <i class="fas fa-calendar-alt"></i> Programador (Click para abrir)
        </h3>
        <div id="prog-form" class="hidden">
            <label>Encendido:</label> <input type="time" id="on-time">
            <label>Apagado:</label> <input type="time" id="off-time">
            <select id="sector-sel">
                <option value="6">EV1 (Pin 6)</option>
                <option value="7">EV2 (Pin 7)</option>
                <option value="9">ABNO (Pin 9)</option>
            </select>
            <button onclick="addProgram()" style="width:100%; padding:10px; background:var(--accent); border:none; margin-top:10px">AÑADIR</button>
            <div id="lista-progs" style="margin-top:10px"></div>
        </div>
    </div>

    <div class="panel">
        <canvas id="tempChart" style="height:150px"></canvas>
    </div>

<script>
    const TOPIC_PREFIX = "CVH_HUERTO";
    const client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "/mqtt", "web_" + Math.random());
    
    client.connect({ useSSL: true, onSuccess: () => {
        document.getElementById('status').innerText = "🟢 MKR1000 CONECTADO";
        client.subscribe(TOPIC_PREFIX + "/telemetria/temp");
    }});

    function sendMQTT(pin, val) {
        const msg = new Paho.MQTT.Message(val);
        msg.destinationName = TOPIC_PREFIX + "/control/" + pin;
        client.send(msg);
        
        const group = document.getElementById(`g-${pin}`);
        group.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
    }

    // Gráfica simple
    const ctx = document.getElementById('tempChart');
    const chart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [{ label: 'Temp', data: [], borderColor: '#38bdf8', tension:0.3 }] },
        options: { plugins: { legend: { display: false } } }
    });

    client.onMessageArrived = (msg) => {
        if(msg.destinationName.includes("temp")) {
            const val = parseFloat(msg.payloadString);
            const now = new Date().toLocaleTimeString();
            chart.data.labels.push(now);
            chart.data.datasets[0].data.push(val);
            if(chart.data.labels.length > 10) { chart.data.labels.shift(); chart.data.datasets[0].data.shift(); }
            chart.update();
        }
    };

    function addProgram() {
        const on = document.getElementById('on-time').value;
        const off = document.getElementById('off-time').value;
        const pin = document.getElementById('sector-sel').value;
        document.getElementById('lista-progs').innerHTML += `<div style="font-size:0.8rem; background:#0f171e; padding:5px; margin-top:2px">Pin ${pin}: ${on} a ${off}</div>`;
    }
</script>
</body>
</html>
