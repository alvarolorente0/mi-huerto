<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RiegoSmart Ultimate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        body { background: #0f1216; color: #f8f9fa; font-family: 'Inter', sans-serif; }
        .card-glass { background: #1a1e23; border: 1px solid #2d3436; border-radius: 15px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .status-badge { font-size: 0.7rem; padding: 4px 8px; border-radius: 20px; }
        .valve-card { position: relative; transition: 0.3s; }
        .active-indicator { position: absolute; top: 10px; right: 10px; font-size: 20px; color: #444; }
        .active-indicator.on { color: #ffce00; text-shadow: 0 0 10px #ffce00; }
        .temp-display { font-size: 3rem; font-weight: bold; color: #00f2ff; }
        .btn-mode { font-size: 11px; margin: 2px; border: 1px solid #444; color: #aaa; background: transparent; }
        .btn-mode.active { background: #007bff; color: white; border-color: #007bff; }
        .accordion-item { background: #252a30; border-color: #3d444b; }
        .accordion-button { background: #252a30; color: white; }
    </style>
</head>
<body class="container py-4">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-0 text-info font-monospace">RIEGOSMART <span class="badge bg-dark border border-info">PRO</span></h1>
            <span id="conn-status" class="status-badge bg-danger">DESCONECTADO</span>
        </div>
        <div class="text-end">
            <div class="small text-muted">Temp. Actual</div>
            <div class="temp-display" id="currTemp">--°C</div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Gráfica -->
        <div class="col-lg-8">
            <div class="card-glass">
                <h6 class="mb-3 text-muted">Historial de Temperatura</h6>
                <canvas id="tempChart" height="140"></canvas>
            </div>
        </div>

        <!-- Válvulas -->
        <div class="col-lg-4">
            <div id="valves-container" class="row g-2"></div>
        </div>
    </div>

    <!-- Desplegable de Programas -->
    <div class="card-glass mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="m-0">📅 Programas de Riego</h5>
            <button class="btn btn-info btn-sm" onclick="addProgram()">+ Añadir Programa</button>
        </div>
        <div class="accordion" id="progAccordion"></div>
    </div>

    <script>
        const BROKER = "wss://4f497890d218456aa4de0965d267c8e9.s1.eu.hivemq.cloud:8884/mqtt";
        const client = mqtt.connect(BROKER, { username: 'mqtt_user', password: 'Mqtt_user1' });

        let programs = JSON.parse(localStorage.getItem('riego_v3')) || [];
        let tempHistory = [];

        // Conexión
        client.on('connect', () => {
            document.getElementById('conn-status').className = "status-badge bg-success";
            document.getElementById('conn-status').innerText = "ONLINE (HIVEMQ)";
            client.subscribe('riego/telemetria');
        });

        // Recibir Datos
        client.on('message', (topic, payload) => {
            if(topic === 'riego/telemetria') {
                const data = JSON.parse(payload);
                document.getElementById('currTemp').innerText = data.t.toFixed(1) + "°C";
                updateChart(data.t);
                // Actualizar rayos indicadores
                data.s.forEach((on, i) => {
                    document.getElementById(`ind-${i+1}`).className = on ? "active-indicator on" : "active-indicator";
                });
            }
        });

        // Interfaz de Válvulas
        const vContainer = document.getElementById('valves-container');
        for(let i=1; i<=3; i++) {
            vContainer.innerHTML += `
                <div class="col-12">
                    <div class="card-glass valve-card py-2">
                        <span id="ind-${i}" class="active-indicator">⚡</span>
                        <div class="small text-muted mb-2">Salida ${i}</div>
                        <div class="btn-group w-100">
                            <button id="v${i}-0" onclick="setMode(${i}, 0)" class="btn btn-mode active">OFF</button>
                            <button id="v${i}-1" onclick="setMode(${i}, 1)" class="btn btn-mode">ON</button>
                            <button id="v${i}-2" onclick="setMode(${i}, 2)" class="btn btn-mode">AUTO</button>
                        </div>
                    </div>
                </div>`;
        }

        function setMode(v, modo) {
            [0,1,2].forEach(m => document.getElementById(`v${v}-${m}`).classList.toggle('active', m === modo));
            client.publish('riego/control', JSON.stringify({v: v, modo: modo}));
        }

        // Gráfica
        const ctx = document.getElementById('tempChart');
        const chart = new Chart(ctx, {
            type: 'line',
            data: { labels: Array(20).fill(''), datasets: [{ label: 'Temp', data: [], borderColor: '#00f2ff', tension: 0.4 }] },
            options: { plugins: { legend: {display:false} }, scales: { x:{display:false}, y:{grid:{color:'#333'}} } }
        });

        function updateChart(t) {
            if(tempHistory.length > 20) tempHistory.shift();
            tempHistory.push(t);
            chart.data.datasets[0].data = tempHistory;
            chart.update();
        }

        // Programas
        function renderPrograms() {
            const acc = document.getElementById('progAccordion');
            acc.innerHTML = '';
            programs.forEach((p, idx) => {
                acc.innerHTML += `
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#c-${idx}">
                            Programa #${idx+1} (${p.start} - ${p.end}) 
                            <span class="ms-2 badge ${p.enabled?'bg-success':'bg-secondary'}">${p.enabled?'Activo':'Pausado'}</span>
                        </button>
                    </h2>
                    <div id="c-${idx}" class="accordion-collapse collapse" data-bs-parent="#progAccordion">
                        <div class="accordion-body">
                            <div class="row align-items-center">
                                <div class="col-md-3">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" ${p.enabled?'checked':''} onchange="updateProg(${idx}, 'enabled', this.checked)">
                                        <label class="form-check-label">Habilitar</label>
                                    </div>
                                </div>
                                <div class="col-md-3">Inicio: <input type="time" class="form-control form-control-sm bg-dark text-white border-0" value="${p.start}" onchange="updateProg(${idx}, 'start', this.value)"></div>
                                <div class="col-md-3">Fin: <input type="time" class="form-control form-control-sm bg-dark text-white border-0" value="${p.end}" onchange="updateProg(${idx}, 'end', this.value)"></div>
                                <div class="col-md-3 text-end"><button class="btn btn-outline-danger btn-sm" onclick="removeProg(${idx})">Eliminar</button></div>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
            localStorage.setItem('riego_v3', JSON.stringify(programs));
        }

        function addProgram() {
            programs.push({ enabled: true, start: "08:00", end: "08:15", valves: [true, false, false], days: [1,2,3,4,5] });
            renderPrograms();
        }
        function updateProg(idx, key, val) { programs[idx][key] = val; renderPrograms(); }
        function removeProg(idx) { programs.splice(idx, 1); renderPrograms(); }

        // Motor de Riego
        setInterval(() => {
            const now = new Date();
            const time = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            let auto = [false, false, false];
            programs.forEach(p => {
                if(p.enabled && time >= p.start && time < p.end) {
                    p.valves.forEach((v, i) => { if(v) auto[i] = true; });
                }
            });
            if(client.connected) client.publish('riego/control', JSON.stringify({auto_exec: auto}));
        }, 5000);

        renderPrograms();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
