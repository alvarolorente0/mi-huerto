<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE RIEGO - MKR1000 PRO</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --neon: #00d4ff; --bg: #050505; --card: #121212; --off: #444; --led-on: #00ffaa; }
        body { background-color: var(--bg); color: var(--neon); font-family: 'Segoe UI', sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        
        /* Dashboard Header */
        .hero-temp { text-align: center; padding: 30px; margin-bottom: 20px; background: radial-gradient(circle, #1a1a1a 0%, #050505 100%); border: 2px solid var(--neon); border-radius: 20px; box-shadow: 0 0 15px rgba(0, 212, 255, 0.2); }
        .temp-val { font-size: 5rem; font-weight: 900; margin: 10px 0; }
        #status-mqtt { font-size: 0.7rem; font-weight: bold; transition: 0.3s; }

        /* Tarjetas y Rejilla */
        .card { background: var(--card); border: 1px solid #222; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        h2 { font-size: 0.8rem; letter-spacing: 2px; color: #666; text-transform: uppercase; margin-top: 0; }
        .ev-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        
        /* Item de Electroválvula */
        .ev-item { background: #000; padding: 20px; border-radius: 12px; border: 1px solid #222; text-align: center; position: relative; }
        .valve-icon { width: 50px; height: 50px; fill: var(--off); transition: 0.5s; margin-bottom: 10px; }
        .valve-icon.active { fill: var(--neon); filter: drop-shadow(0 0 8px var(--neon)); }
        
        /* LED de estado físico */
        .status-led { width: 10px; height: 10px; border-radius: 50%; background-color: #222; margin: 0 auto 15px; transition: 0.3s; }
        .status-led.on { background-color: var(--led-on); box-shadow: 0 0 10px var(--led-on); }

        /* Botonera Triple */
        .group-btn { display: flex; gap: 4px; background: #111; padding: 4px; border-radius: 8px; }
        .btn { flex: 1; padding: 10px 5px; cursor: pointer; background: transparent; border: 1px solid transparent; color: #444; border-radius: 6px; font-size: 0.65rem; font-weight: 900; transition: 0.2s; }
        
        /* Estados de botones */
        .btn.active-on { background: rgba(0, 255, 170, 0.1); border-color: var(--led-on); color: var(--led-on); }
        .btn.active-off { background: rgba(255, 68, 68, 0.1); border-color: #ff4444; color: #ff4444; }
        .btn.active-auto { background: rgba(0, 212, 255, 0.1); border-color: var(--neon); color: var(--neon); }
        
        canvas { width: 100% !important; max-height: 150px; }
    </style>
</head>
<body>

    <div class="hero-temp">
        <div style="font-size: 0.7rem; letter-spacing: 4px; color: #555;">MONITOR DE CLIMA</div>
        <div class="temp-val"><span id="bigTemp">--.-</span>°C</div>
        <div id="status-mqtt" style="color: #ff4444;">DISPOSITIVO DESCONECTADO</div>
    </div>

    <div class="card">
        <h2>Control de Electroválvulas</h2>
        <div class="ev-grid" id="valve-container">
            </div>
    </div>

    <div class="card">
        <h2>Histórico de Temperatura</h2>
        <canvas id="tempChart"></canvas>
    </div>

<script>
    // --- CONFIGURACIÓN MQTT ---
    const broker = 'wss://TU_ID_AQUÍ.s1.eu.hivemq.cloud:8884/mqtt'; 
    const options = { username: 'huertosss', password: 'blancaym15' };
    const client = mqtt.connect(broker, options);

    // Estados internos (Sincronizados con el Arduino)
    let manualModes = { 6: 2, 7: 2, 9: 2 }; // 0:OFF, 1:ON, 2:AUTO
    let realStates = { 6: 0, 7: 0, 9: 0 };  // Estado físico reportado por el relé
    let tempData = [];

    // --- GRÁFICA ---
    const ctx = document.getElementById('tempChart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                data: [],
                borderColor: '#00d4ff',
                backgroundColor: 'rgba(0, 212, 255, 0.05)',
                borderWidth: 2,
                fill: true,
                tension: 0.4,
                pointRadius: 0
            }]
        },
        options: {
            plugins: { legend: false },
            scales: { 
                x: { display: false },
                y: { grid: { color: '#222' }, ticks: { color: '#555' } }
            }
        }
    });

    // --- LÓGICA DE INTERFAZ ---
    function renderValves() {
        const container = document.getElementById('valve-container');
        container.innerHTML = '';
        
        [6, 7, 9].forEach(pin => {
            const isWorking = realStates[pin] === 1;
            const mode = manualModes[pin];

            const div = document.createElement('div');
            div.className = 'ev-item';
            div.innerHTML = `
                <div class="status-led ${isWorking ? 'on' : ''}"></div>
                <svg class="valve-icon ${isWorking ? 'active' : ''}" viewBox="0 0 24 24">
                    <path d="M12,7V3H10V7H5V9H10V11H12V9H17V7H12M13,15V13H11V15H7V21H17V15H13"/>
                </svg>
                <div style="font-size: 0.7rem; color: #555; margin-bottom: 12px;">SALIDA PIN ${pin}</div>
                <div class="group-btn">
                    <button class="btn ${mode === 1 ? 'active-on' : ''}" onclick="sendCommand(${pin}, 1)">ON</button>
                    <button class="btn ${mode === 2 ? 'active-auto' : ''}" onclick="sendCommand(${pin}, 2)">AUTO</button>
                    <button class="btn ${mode === 0 ? 'active-off' : ''}" onclick="sendCommand(${pin}, 0)">OFF</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function sendCommand(pin, val) {
        manualModes[pin] = val;
        // Enviamos el JSON exacto que espera tu Arduino en el tópico "jardin/manual"
        const payload = JSON.stringify({ pin: pin, val: val });
        client.publish('jardin/manual', payload);
        renderValves();
    }

    // --- CONEXIÓN Y MENSAJES ---
    client.on('connect', () => {
        document.getElementById('status-mqtt').innerText = "SISTEMA EN LÍNEA";
        document.getElementById('status-mqtt').style.color = "#00ffaa";
        client.subscribe(['jardin/estado', 'jardin/temp_log']);
    });

    client.on('message', (topic, message) => {
        const msg = message.toString();

        if (topic === 'jardin/estado') {
            // El Arduino envía: {"6":0, "7":1, "9":0}
            realStates = JSON.parse(msg);
            renderValves();
        }

        if (topic === 'jardin/temp_log') {
            const temp = parseFloat(msg);
            document.getElementById('bigTemp').innerText = temp.toFixed(1);
            
            // Actualizar Gráfica
            chart.data.labels.push("");
            chart.data.datasets[0].data.push(temp);
            if (chart.data.labels.length > 30) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
            }
            chart.update('none');
        }
    });

    // Inicializar UI
    renderValves();
</script>
</body>
</html>
