<!DOCTYPE HTML>
<html>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Riego Smart Cloud</title>
    <script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body{font-family:sans-serif; background:#0d1117; color:#c9d1d9; margin:0; padding:10px; text-align:center;}
        .container{max-width:900px; margin:auto; display:flex; flex-wrap:wrap; justify-content:center; gap:12px;}
        .card{background:#161b22; border:1px solid #30363d; border-radius:12px; padding:12px; flex:1 1 280px; box-sizing: border-box;}
        .btn-group{display:flex; gap:4px; margin-top:8px;}
        .btn{flex:1; padding:10px 2px; border-radius:6px; border:none; cursor:pointer; background:#21262d; color:white; font-weight:bold; font-size:12px; transition: background 0.2s;}
        .active{background:#238636;}
        .btn:hover{filter: brightness(1.2);}
        .on{color:#3fb950;} .off{color:#f85149;}
        details{width:100%; background:#161b22; border:1px solid #30363d; border-radius:12px; text-align:left;}
        summary{padding:12px; cursor:pointer; font-weight:bold;}
        .chart-card{width:100%; height:220px; margin-bottom: 5px;}
        input[type=time], input[type=password], input[type=text], select{background:#0d1117; color:white; border:1px solid #30363d; padding:6px; border-radius:5px; text-align:center;}
        
        #login-screen {
            max-width: 320px; margin: 100px auto; padding: 25px; 
            background: #161b22; border: 1px solid #30363d; border-radius: 12px;
        }
        #app-content { display: none; } 
        .error-msg { color: #f85149; font-size: 13px; margin-top: 10px; display: none; }
        
        /* --- NUEVO ESTILO PROFESIONAL DE PROGRAMAS --- */
        .prog-card {
            background: #1f242c; border: 1px solid #30363d; border-radius: 10px;
            padding: 14px; margin-bottom: 10px; position: relative;
            display: flex; flex-direction: column; gap: 10px; text-align: left;
            border-left: 4px solid #30363d; transition: border-color 0.3s;
        }
        .prog-card.enabled { border-left-color: #2ea043; } /* Verde si está activo */
        
        .prog-header { display: flex; justify-content: space-between; align-items: center; }
        .prog-title { font-weight: bold; color: #f0f6fc; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        
        .prog-time-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #8b949e; }
        
        .day-circle {
            width: 28px; height: 28px; border-radius: 50%; border: none;
            background: #21262d; color: #8b949e; font-size: 11px; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .day-circle.active { background: #1f6feb; color: #ffffff; box-shadow: 0 0 8px rgba(31, 111, 235, 0.4); }
        
        .ev-tag {
            padding: 6px 10px; border-radius: 6px; background: #21262d; border: 1px solid #30363d;
            color: #8b949e; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px;
        }
        .ev-tag.active { background: rgba(56, 139, 253, 0.15); border-color: #58a6ff; color: #58a6ff; }
        
        .btn-delete {
            background: none; border: none; color: #f85149; cursor: pointer;
            font-size: 16px; padding: 4px; border-radius: 4px; transition: background 0.2s;
        }
        .btn-delete:hover { background: rgba(248, 81, 73, 0.15); }
        
        /* Switch minimalista */
        .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #21262d; transition: .3s; border-radius: 20px; border: 1px solid #30363d; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: #8b949e; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #2ea043; border-color: #2ea043; }
        input:checked + .slider:before { transform: translateX(14px); background-color: white; }

        .weather-box {
            background: #161b22; border: 1px solid #30363d; padding: 10px; 
            border-radius: 8px; margin: 10px auto; max-width: 860px;
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
        }
        .aemet-info { color: #58a6ff; font-weight: bold; font-size: 14px;}
        .cp-selector { display: flex; gap: 5px; align-items: center;}

        /* --- NUEVO ESTILO DE SCROLL PARA LA LISTA DE PROGRAMAS --- */
        #listaProg {
            max-height: 260px;
            overflow-y: auto;
            padding: 10px;
            scrollbar-width: thin;
            scrollbar-color: #30363d #161b22;
        }
        #listaProg::-webkit-scrollbar {
            width: 6px;
        }
        #listaProg::-webkit-scrollbar-track {
            background: #161b22;
        }
        #listaProg::-webkit-scrollbar-thumb {
            background-color: #30363d;
            border-radius: 3px;
        }
    </style>
</head>
<body>

<div id="login-screen">
    <h2>🌱 Riego Cloud</h2>
    <p style="color: #8b949e; font-size: 14px;">Introduce la contraseña de acceso</p>
    <input type="password" id="passInput" placeholder="••••" maxlength="8" onkeydown="if(event.key==='Enter') verificarPassword()"><br><br>
    <button class="btn active" style="padding: 10px 20px; width: 100%;" onclick="verificarPassword()">INGRESAR</button>
    <div id="error" class="error-msg">⚠️ Contraseña incorrecta</div>
</div>

<div id="app-content">
    <h2>🌱 RIEGO CLOUD</h2>
    
    <div class="weather-box">
        <div style="font-size: 14px;">
            ⏰ <span id='hora'>--:--:--</span> | 🌡️ Sonda: <span id='temp' class='on'>--</span>°C
        </div>
        
        <span id="aemet-prediccion" class="aemet-info">🌤️ Cargando clima...</span>
        
        <div class="cp-selector">
            <input type="text" id="cpInput" placeholder="50461" style="width: 80px;" maxlength="5">
            <select id="municipioSelect" style="max-width: 150px; display: none;" onchange="cambiarMunicipioManual()"></select>
            <button class="btn active" style="padding: 8px 12px;" onclick="buscarPorCodigoPostal()">🔍</button>
        </div>
    </div>

    <div id="status" style="font-size: 11px; color: #8b949e; margin-bottom: 15px;">Iniciando conexión con Shiftr.io...</div>

    <div class='container'>
        <details open>
            <summary>📅 PROGRAMACIÓN DE RIEGO</summary>
            <div id='listaProg'></div>
            <button class='btn active' style='margin: 4px 10px 14px 10px; width:calc(100% - 20px); height: 38px; font-size: 13px;' onclick='addP()'>+ AÑADIR PROGRAMA NUEVO</button>
        </details>
        
        <div id='valvulas' style='width:100%; display:flex; flex-wrap:wrap; gap:12px;'></div>
        
        <!-- Tarjeta para ver el consumo de datos de red del Arduino -->
        <div id='datos-consumo' style='width:100%; display:flex; gap:12px; margin-bottom:5px;'></div>
        
        <div class='card chart-card'>
            <strong style="display:block; margin-bottom:4px;">Historial Sonda 24h (°C)</strong>
            <div style="position: relative; height: 160px; width: 100%;">
                <canvas id='myChart'></canvas>
            </div>
        </div>

        <div class='card chart-card'>
            <strong style="display:block; margin-bottom:4px; color: #58a6ff;">Previsión Pluviometría (mm o l/m²)</strong>
            <div style="position: relative; height: 160px; width: 100%;">
                <canvas id='rainChart'></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    const CLAVE_CORRECTA = "1234";

    function verificarPassword() {
        const input = document.getElementById('passInput').value;
        if (input === CLAVE_CORRECTA) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            conectarMQTT();
            
            let cpGuardado = localStorage.getItem('riegocp') || '50461';
            document.getElementById('cpInput').value = cpGuardado;
            buscarPorCodigoPostal();
            
            renderP(); 
        } else {
            document.getElementById('error').style.display = 'block';
            document.getElementById('passInput').value = '';
        }
    }

    // --- BUSCADOR GEOGRÁFICO ---
    function buscarPorCodigoPostal() {
        const cp = document.getElementById('cpInput').value.trim();
        if(cp.length !== 5 || isNaN(cp)) {
            alert("Por favor, introduce un Código Postal válido.");
            return;
        }
        
        localStorage.setItem('riegocp', cp);
        const select = document.getElementById('municipioSelect');
        select.innerHTML = "";
        
        let nombreLocalidad = "Zona " + cp;
        let codigoAemet = cp.substring(0, 2) + "001"; 
        let lat = "41.6563", lon = "-0.8773"; 
        
        if (cp === "50461") {
            nombreLocalidad = "Alfamén";
            codigoAemet = "50018";
            lat = "41.4382"; lon = "-1.2418";
        } else if (cp === "50000" || cp === "50001" || cp === "50002" || cp === "50003" || cp === "50004" || cp === "50005") {
            nombreLocalidad = "Zaragoza";
            codigoAemet = "50297";
            lat = "41.6563"; lon = "-0.8773";
        }
        
        let op = document.createElement('option');
        op.value = codigoAemet;
        op.dataset.lat = lat;
        op.dataset.lon = lon;
        op.text = nombreLocalidad;
        select.appendChild(op);
        select.style.display = "inline-block";
        
        obtenerClimaHibrido(codigoAemet, nombreLocalidad, lat, lon);
    }

    function cambiarMunicipioManual() {
        const select = document.getElementById('municipioSelect');
        const op = select.options[select.selectedIndex];
        obtenerClimaHibrido(op.value, op.text, op.dataset.lat, op.dataset.lon);
    }

    // --- GESTOR DE CLIMA HÍBRIDO ---
    async function obtenerClimaHibrido(codigoAemet, nombrePueblo, lat, lon) {
        document.getElementById("aemet-prediccion").innerHTML = "🌤️ Consultando tiempo...";
        let aemetExitoso = await procesarAemet(codigoAemet, nombrePueblo);
        if (!aemetExitoso) {
            await procesarClimaReserva(nombrePueblo, lat, lon);
        }
    }

    async function procesarAemet(codigoMuniAemet, nombrePueblo) {
        try {
            const url = `https://www.aemet.es/xml/municipios/localidad_${codigoMuniAemet}.xml`;
            const controlador = new AbortController();
            setTimeout(() => controlador.abort(), 2500);

            const respuesta = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}&_=${Date.now()}`, { signal: controlador.signal });
            if(!respuesta.ok) return false;
            
            const datos = await respuesta.json();
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(datos.contents, "text/xml");
            const hoy = xmlDoc.getElementsByTagName("dia")[0];
            if(!hoy) return false;
            
            const estadosCielo = hoy.getElementsByTagName("estado_cielo");
            let descripcionCielo = "Despejado";
            for(let i = estadosCielo.length - 1; i >= 0; i--) {
                let desc = estadosCielo[i].getAttribute("descripcion");
                if(desc) { descripcionCielo = desc; break; }
            }
            const maxima = hoy.getElementsByTagName("maxima")[0].textContent || "--";
            const minima = hoy.getElementsByTagName("minima")[0].textContent || "--";
            
            const lluviaNodos = hoy.getElementsByTagName("prob_precipitacion");
            let datosPrecipitacion = Array(24).fill(0);
            
            if(lluviaNodos.length > 0) {
                let probHoy = parseInt(lluviaNodos[0].textContent) || 0;
                let estimacionMm = probHoy > 70 ? 4 : probHoy > 40 ? 1.5 : probHoy > 10 ? 0.5 : 0;
                for(let h=12; h<20; h++) datosPrecipitacion[h] = estimacionMm; 
            }
            
            actualizarGraficaLluvia(datosPrecipitacion);

            let icono = "🌤️";
            if(descripcionCielo.toLowerCase().match(/(lluvia|chubasco|llovizna|tormenta)/)) icono = "🌧️";
            else if(descripcionCielo.toLowerCase().match(/(cubierto|nuboso|nubes)/)) icono = "☁️";
            else if(descripcionCielo.toLowerCase().match(/(despejado|sol)/)) icono = "☀️";

            document.getElementById("aemet-prediccion").innerHTML = `${icono} ${nombrePueblo}: ${descripcionCielo} (${minima}°C / ${maxima}°C)`;
            return true;
        } catch (e) {
            return false;
        }
    }

    async function procesarClimaReserva(nombrePueblo, lat, lon) {
        try {
            const url = `https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${lat}&lon=${lon}`;
            const respuesta = await fetch(url);
            if(!respuesta.ok) throw new Error();
            const json = await respuesta.json();
            
            const dataHoy = json.properties.timeseries[0].data;
            const condicion = dataHoy.next_1_hours.summary.symbol_code;
            
            let descripcionCielo = "Despejado";
            let icono = "☀️";
            
            if(condicion.includes("rain") || condicion.includes("sleet")) { descripcionCielo = "Lluvia"; icono = "🌧️"; }
            else if(condicion.includes("cloud") || condicion.includes("fog")) { descripcionCielo = "Nuboso"; icono = "☁️"; }
            else { descripcionCielo = "Despejado"; icono = "☀️"; }
            
            let temps = json.properties.timeseries.slice(0, 24).map(t => t.data.instant.details.air_temperature);
            let maxima = Math.round(Math.max(...temps));
            let minima = Math.round(Math.min(...temps));

            let datosPrecipitacion = [];
            for(let i=0; i<24; i++) {
                let bloqueHora = json.properties.timeseries[i];
                datosPrecipitacion.push(bloqueHora?.data?.next_1_hours?.details?.precipitation_amount || 0);
            }
            actualizarGraficaLluvia(datosPrecipitacion);

            document.getElementById("aemet-prediccion").innerHTML = `${icono} ${nombrePueblo}: ${descripcionCielo} (${minima}°C / ${maxima}°C)`;
        } catch(e) {
            document.getElementById("aemet-prediccion").innerHTML = `⚠️ Clima fuera de línea`;
        }
    }

    function actualizarGraficaLluvia(listaValores) {
        rainChart.data.datasets[0].data = listaValores;
        rainChart.update('none');
    }

    // --- CONEXIÓN MQTT SHIFTR.IO ---
    let mqttClient;
    function conectarMQTT() {
        mqttClient = mqtt.connect('wss://public:public@public.cloud.shiftr.io', {
            clientId: 'web-cvh-' + Math.random().toString(16).substr(2, 4)
        });
        mqttClient.on('connect', () => {
            document.getElementById('status').innerHTML = "🟢 CONECTADO A SHIFTR.IO";
            document.getElementById('status').style.color = "#3fb950";
            mqttClient.subscribe('CVH/riego/data');
        });
        mqttClient.on('message', (topic, message) => {
            if(topic === 'CVH/riego/data') up(message.toString());
        });
        mqttClient.on('error', () => {
            document.getElementById('status').innerHTML = "🔴 ERROR DE CONEXIÓN";
            document.getElementById('status').style.color = "#f85149";
        });
    }

    // --- CONFIGURACIÓN DE LAS DOS GRÁFICAS ---
    const ctx = document.getElementById('myChart').getContext('2d');
    const myChart = new Chart(ctx, { 
        type: 'line', 
        data: { 
            labels: Array.from({length: 24}, (_, i) => i+'h'), 
            datasets: [{ data: Array(24).fill(0), borderColor: '#ffa040', tension: 0.4, fill: true, backgroundColor: 'rgba(255, 160, 64, 0.08)', pointRadius:1 }] 
        }, 
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { ticks:{font:{size:9}, color:'#8b949e'}, grid: {color:'#30363d'} }, x: { ticks:{font:{size:9}, color:'#8b949e'}, grid: {display:false} } }, plugins: { legend: {display:false} } } 
    });

    const ctxRain = document.getElementById('rainChart').getContext('2d');
    const rainChart = new Chart(ctxRain, { 
        type: 'line', 
        data: { 
            labels: Array.from({length: 24}, (_, i) => '+'+i+'h'), 
            datasets: [{ data: Array(24).fill(0), borderColor: '#58a6ff', tension: 0.3, fill: true, backgroundColor: 'rgba(88, 166, 255, 0.2)', pointRadius:2 }] 
        }, 
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, ticks:{font:{size:9}, color:'#8b949e'}, grid: {color:'#30363d'} }, x: { ticks:{font:{size:9}, color:'#8b949e'}, grid: {display:false} } }, plugins: { legend: {display:false} } } 
    });

    // --- RECEPCIÓN DE DATOS ---
    function up(data){
        let p = data.split('|');
        if(p.length < 8) return;
        document.getElementById('temp').innerHTML = p[0];
        document.getElementById('hora').innerHTML = p[7];
        if(p[8]){ myChart.data.datasets[0].data = p[8].split(',').map(Number); myChart.update('none'); }
        
        let vH=''; 
        for(let i=1; i<=3; i++){
            let estadoValvula = p[i] == '1' ? 'on' : 'off';
            let textoValvula = p[i] == '1' ? '💧 Abierta' : '❌ Cerrada';
            vH += `<div class='card'><b>🚰 EV ${i}</b> <span class='${estadoValvula}' style='float:right; font-size:12px; font-weight:bold;'>${textoValvula}</span><div class='btn-group'>`;
            [0,1,2].forEach(m => {
                let modoActivo = p[i+3] == m ? 'active' : '';
                let textoModo = m == 0 ? 'OFF' : m == 1 ? 'ON' : 'AUTO';
                vH += `<button class='btn ${modoActivo}' onclick='enviarComando("SET_M:${i}:${m}")'>${textoModo}</button>`;
            });
            vH += '</div></div>';
        }
        document.getElementById('valvulas').innerHTML = vH;

        // --- GESTIÓN DE CONSUMO DE DATOS DESDE EL ARDUINO ---
        let consumoActual = p[9] ? p[9] : '0.00'; 
        let consumoTotal = p[10] ? p[10] : '0.000';

        let cH = `
            <div class='card' style='width:100%; text-align:left; display:flex; justify-content:space-between; align-items:center;'>
                <div>
                    <b style='color:#58a6ff; display:block; margin-bottom:4px;'>📊 Tráfico de Datos (Red)</b>
                    <span style='font-size:13px; color:#8b949e;'>Último paquete: <span class='on' style='font-weight:bold;'>${consumoActual} KB</span></span>
                </div>
                <div style='text-align:right;'>
                    <span style='font-size:11px; color:#8b949e; display:block;'>CONSUMO TOTAL</span>
                    <b style='font-size:18px; color:#ffffff;'>${consumoTotal} <span style='font-size:12px; color:#58a6ff;'>MB</span></b>
                </div>
            </div>
        `;
        document.getElementById('datos-consumo').innerHTML = cH;
    }

    function enviarComando(cmd) { if(mqttClient && mqttClient.connected) mqttClient.publish('CVH/riego/cmd', cmd); }

    // --- AUTOMATIZACIÓN (TICK) ---
    let progs = JSON.parse(localStorage.getItem('riegodb') || '[]');
    function tick(){
        if(document.getElementById('app-content').style.display !== 'block') return;
        let hStr = document.getElementById('hora').innerHTML;
        if(hStr == '--:--:--') return;
        let cur = hStr.substring(0,5), curD = new Date().getDay(), ex = [0,0,0];
        progs.forEach(p => { if(p.en && p.days.includes(curD) && cur >= p.on && cur < p.off){ p.evs.forEach((v, idx) => { if(v) ex[idx] = 1; }); } });
        enviarComando(`AUTO:${ex[0]}:${ex[1]}:${ex[2]}`);
    }
    setInterval(tick, 5000);

    // --- GESTIÓN DE PROGRAMAS (CON RENDERIZADO PROFESIONAL) ---
    function addP(){ 
        if(progs.length >= 5) return alert("Máximo 5 programas."); 
        progs.push({on:'08:00', off:'08:30', evs:[true,false,false], days:[1,2,3,4,5], en:true}); 
        renderP(); 
    }
    function tglEv(pIdx, vIdx) { progs[pIdx].evs[vIdx] = !progs[pIdx].evs[vIdx]; renderP(); }
    function tglDay(pIdx, dIdx){ let pos = progs[pIdx].days.indexOf(dIdx); if(pos > -1) progs[pIdx].days.splice(pos, 1); else progs[pIdx].days.push(dIdx); renderP(); }
    function eliminarP(index) { progs.splice(index, 1); renderP(); }
    function actualizarHoraProg(index, tipo, valor) { progs[index][tipo] = valor; localStorage.setItem('riegodb', JSON.stringify(progs)); }

    function renderP(){ 
        localStorage.setItem('riegodb', JSON.stringify(progs)); 
        let h = ''; 
        
        progs.forEach((p, i) => { 
            h += `<div class='prog-card ${p.en ? 'enabled' : ''}'>
                <div class='prog-header'>
                    <div class='prog-title'>⚙️ PROGRAMA ${i+1}</div>
                    <div style='display:flex; align-items:center; gap:12px;'>
                        <label class="switch">
                            <input type="checkbox" ${p.en ? 'checked' : ''} onchange='progs[${i}].en=this.checked; renderP()'>
                            <span class="slider"></span>
                        </label>
                        <button class='btn-delete' onclick='eliminarP(${i})' title='Eliminar'>🗑️</button>
                    </div>
                </div>
                
                <div class='prog-time-row'>
                    ⏱️ Intervalo: 
                    <input type='time' value='${p.on}' onchange='actualizarHoraProg(${i}, "on", this.value)'> 
                    <span>→</span> 
                    <input type='time' value='${p.off}' onchange='actualizarHoraProg(${i}, "off", this.value)'>
                </div>
                
                <div style='display:flex; gap:5px; flex-wrap:wrap; margin-top:2px;'>`; 
            
            ['D','L','M','X','J','V','S'].forEach((d, idx) => { 
                h += `<button class='day-circle ${p.days.includes(idx) ? 'active' : ''}' onclick='tglDay(${i}, ${idx})'>${d}</button>`; 
            }); 
            
            h += `</div><div style='display:flex; gap:6px; margin-top:4px;'>`; 
            
            p.evs.forEach((v, vidx) => { 
                h += `<div class='ev-tag ${v ? 'active' : ''}' onclick='tglEv(${i}, ${vidx})'>🚰 EV${vidx+1}</div>`; 
            }); 
            
            h += `</div></div>`; 
        }); 
        
        document.getElementById('listaProg').innerHTML = h; 
    }
    renderP();
</script>
</body>
</html>
