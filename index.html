<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huerto Smart Pro v6</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0b0c10; --card: #1c252e; --accent: #38bdf8; --on: #22c55e; --off: #ef4444; --auto: #eab308; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #d1d5db; margin: 0; padding: 15px; }
        .temp-card { text-align: center; padding: 20px; background: var(--card); border-radius: 12px; margin-bottom: 15px; border-bottom: 4px solid var(--accent); }
        .main-temp { font-size: 3.5rem; font-weight: bold; color: var(--accent); }
        
        .panel { background: var(--card); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #2d3748; }
        .device-row { display: flex; align-items: center; justify-content: space-between; background: #0f171e; padding: 10px; margin-bottom: 8px; border-radius: 6px; }
        
        /* Botones de Modo */
        .btn-group button { padding: 8px 12px; border: 1px solid #333; background: #1c252e; color: #666; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button.active { color: white !important; border-color: white; }
        .btn-on.active { background: var(--on); } .btn-off.active { background: var(--off); } .btn-auto.active { background: var(--auto); color: black !important; }

        /* Acordeón */
        .collapsible { background: #2d3748; color: var(--accent); cursor: pointer; padding: 15px; width: 100%; border: none; text-align: left; font-size: 16px; font-weight: bold; border-radius: 8px; display: flex; justify-content: space-between; }
        .content { padding: 0 15px; display: none; background-color: #1c252e; border: 1px solid #2d3748; border-top: none; border-radius: 0 0 8px 8px; margin-bottom: 15px; }
        
        /* Chips y Selectores */
        .chips-container { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 20px; }
        .chip { padding: 8px; background: #0f171e; border: 1px solid #333; border-radius: 6px; cursor: pointer; flex: 1; text-align: center; min-width: 50px; font-size: 0.8rem; }
        .chip.selected { background: var(--accent); color: black; font-weight: bold; }
        .time-input { background: #0f171e; border: 1px solid #333; color: white; padding: 10px; border-radius: 6px; width: 45%; }
        .btn-save { width: 100%; padding: 12px; background: var(--on); border: none; border-radius: 6px; color: white; font-weight: bold; margin: 15px 0; cursor: pointer; }

        /* Lista de Programas */
        .prog-item { background: #0f171e; padding: 12px; margin-bottom: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #444; }
        .prog-item.enabled { border-left-color: var(--on); }
        .prog-actions i { cursor: pointer; font-size: 1.3rem; margin-left: 15px; }
    </style>
</head>
<body>

    <div class="temp-card">
        <div class="main-temp" id="temp-val">--°C</div>
        <small>TEMPERATURA AMBIENTE (A1)</small>
    </div>

    <div class="panel">
        <div class="device-row" id="row-6">
            <span><i class="fas fa-faucet"></i> EV1</span>
            <div class="btn-group">
                <button class="btn-off" onclick="changeMode(6, '0')">OFF</button>
                <button class="btn-auto" onclick="changeMode(6, '2')">AUTO</button>
                <button class="btn-on" onclick="changeMode(6, '1')">ON</button>
            </div>
        </div>
        <div class="device-row" id="row-7">
            <span><i class="fas fa-faucet"></i> EV2</span>
            <div class="btn-group">
                <button class="btn-off" onclick="changeMode(7, '0')">OFF</button>
                <button class="btn-auto" onclick="changeMode(7, '2')">AUTO</button>
                <button class="btn-on" onclick="changeMode(7, '1')">ON</button>
            </div>
        </div>
        <div class="device-row" id="row-9">
            <span><i class="fas fa-seedling"></i> ABONO</span>
            <div class="btn-group">
                <button class="btn-off" onclick="changeMode(9, '0')">OFF</button>
                <button class="btn-auto" onclick="changeMode(9, '2')">AUTO</button>
                <button class="btn-on" onclick="changeMode(9, '1')">ON</button>
            </div>
        </div>
    </div>

    <button class="collapsible" onclick="toggleAccordion()">
        PROGRAMACIÓN HORARIA <i class="fas fa-chevron-down"></i>
    </button>
    <div class="content" id="acc-content">
        <p style="font-size:0.8rem; color:var(--accent);">1. Elige Días:</p>
        <div class="chips-container" id="day-chips">
            <div class="chip" data-val="1">Lu</div><div class="chip" data-val="2">Ma</div><div class="chip" data-val="3">Mi</div>
            <div class="chip" data-val="4">Ju</div><div class="chip" data-val="5">Vi</div><div class="chip" data-val="6">Sa</div><div class="chip" data-val="0">Do</div>
        </div>
        <p style="font-size:0.8rem; color:var(--accent);">2. Elige Sectores:</p>
        <div class="chips-container" id="pin-chips">
            <div class="chip" data-val="6">EV1</div><div class="chip" data-val="7">EV2</div><div class="chip" data-val="9">ABONO</div>
        </div>
        <div style="display: flex; justify-content: space-between;">
            <input type="time" id="t-on" class="time-input">
            <input type="time" id="t-off" class="time-input">
        </div>
        <button class="btn-save" onclick="saveNewProg()">CREAR PROGRAMA</button>
        <div id="lista-progs"></div>
    </div>

    <div class="panel"><canvas id="tempChart"></canvas></div>

<script>
    const TOPIC = "CVH_HUERTO";
    let chart;
    let programas = JSON.parse(localStorage.getItem('h_progs')) || [];
    let estados = JSON.parse(localStorage.getItem('h_states')) || { "6":"0", "7":"0", "9":"0" };
    let historico = JSON.parse(localStorage.getItem('h_chart')) || Array(48).fill(null);

    const client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "/mqtt", "u_" + Math.random());

    client.connect({ useSSL: true, onSuccess: () => {
        client.subscribe(TOPIC + "/telemetria/temp");
        syncAll();
    }});

    function toggleAccordion() {
        const c = document.getElementById("acc-content");
        c.style.display = (c.style.display === "block") ? "none" : "block";
    }

    document.querySelectorAll('.chip').forEach(c => c.onclick = () => c.classList.toggle('selected'));

    function changeMode(pin, val) {
        estados[pin] = val;
        localStorage.setItem('h_states', JSON.stringify(estados));
        const msg = new Paho.MQTT.Message(val);
        msg.destinationName = `${TOPIC}/control/${pin}`;
        msg.retained = true;
        client.send(msg);
        updateButtonsUI();
    }

    function updateButtonsUI() {
        [6, 7, 9].forEach(pin => {
            const row = document.getElementById(`row-${pin}`);
            if(!row) return;
            const btns = row.querySelectorAll('button');
            btns.forEach(b => b.classList.remove('active'));
            const s = estados[pin];
            if(s==="0") btns[0].classList.add('active');
            else if(s==="2") btns[1].classList.add('active');
            else if(s==="1") btns[2].classList.add('active');
        });
    }

    function saveNewProg() {
        const days = Array.from(document.querySelectorAll('#day-chips .selected')).map(c => parseInt(c.dataset.val));
        const pins = Array.from(document.querySelectorAll('#pin-chips .selected')).map(c => parseInt(c.dataset.val));
        const on = document.getElementById('t-on').value;
        const off = document.getElementById('t-off').value;

        if(!days.length || !pins.length || !on || !off) return alert("Faltan datos");

        programas.push({ id: Date.now(), days, pins, on, off, enabled: true });
        syncAll();
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
    }

    function toggleEnable(id) {
        const p = programas.find(x => x.id === id);
        p.enabled = !p.enabled;
        syncAll();
    }

    function delProg(id) {
        programas = programas.filter(x => x.id !== id);
        syncAll();
    }

    function syncAll() {
        localStorage.setItem('h_progs', JSON.stringify(programas));
        renderProgs();
        updateButtonsUI();
        const msg = new Paho.MQTT.Message(JSON.stringify(programas));
        msg.destinationName = TOPIC + "/config/progs";
        msg.retained = true;
        client.send(msg);
    }

    function renderProgs() {
        const div = document.getElementById('lista-progs');
        div.innerHTML = "";
        programas.forEach(p => {
            div.innerHTML += `
                <div class="prog-item ${p.enabled ? 'enabled' : ''}">
                    <div>
                        <b>Pins: ${p.pins.join(', ')}</b><br>
                        <small>${p.on} - ${p.off} | Días: ${p.days.join(',')}</small>
                    </div>
                    <div class="prog-actions">
                        <i class="fas ${p.enabled?'fa-toggle-on':'fa-toggle-off'}" onclick="toggleEnable(${p.id})" style="color:${p.enabled?'var(--on)':'#555'}"></i>
                        <i class="fas fa-trash-alt" onclick="delProg(${p.id})" style="color:var(--off)"></i>
                    </div>
                </div>`;
        });
    }

    function initChart() {
        const ctx = document.getElementById('tempChart');
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array.from({length: 48}, (_, i) => Math.floor(i/2) + (i%2?':30':':00')),
                datasets: [{ label: 'Temp °C', data: historico, borderColor: '#38bdf8', tension: 0.3, backgroundColor: 'rgba(56,189,248,0.1)', fill: true }]
            },
            options: { scales: { y: { beginAtZero: false } } }
        });
    }

    client.onMessageArrived = (msg) => {
        if(msg.destinationName.includes("temp")) {
            const t = parseFloat(msg.payloadString);
            document.getElementById('temp-val').innerText = t.toFixed(1) + "°C";
            
            const now = new Date();
            const min = now.getMinutes();
            if(min === 0 || min === 30) {
                const idx = now.getHours() * 2 + (min === 30 ? 1 : 0);
                historico[idx] = t;
                localStorage.setItem('h_chart', JSON.stringify(historico));
                chart.update();
            }
        }
    };
    initChart();
</script>
</body>
</html>
