<!DOCTYPE html>
<html>
<head>
    <title>Smart Irrigation MKR1000</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn { padding: 10px; cursor: pointer; border: none; border-radius: 4px; }
        .on { background: #28a745; color: white; }
        .off { background: #dc3545; color: white; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Control Manual</h2>
        V6: <button class="btn off" onclick="sendManual(6, true)">ON</button> <button class="btn off" onclick="sendManual(6, false)">OFF</button>
        V7: <button class="btn off" onclick="sendManual(7, true)">ON</button> <button class="btn off" onclick="sendManual(7, false)">OFF</button>
        V9: <button class="btn off" onclick="sendManual(9, true)">ON</button> <button class="btn off" onclick="sendManual(9, false)">OFF</button>
    </div>

    <div class="card">
        <h2>Programación de Riego</h2>
        <div id="listaProgramas"></div>
        <button class="btn on" onclick="crearPrograma()">+ Nuevo Programa</button>
    </div>

    <div class="card">
        <canvas id="tempChart"></canvas>
    </div>

<script>
    // Configuración HiveMQ (Websocket)
    const client = mqtt.connect('wss://TU_ID.s1.eu.hivemq.cloud:8884/mqtt', {
        username: 'TU_USER',
        password: 'TU_PASSWORD'
    });

    let programas = JSON.parse(localStorage.getItem('programas')) || [];
    let historyTemp = JSON.parse(localStorage.getItem('historyTemp')) || [];

    client.on('connect', () => {
        client.subscribe('jardin/temp_log');
        // Sincronizar hora con Arduino
        client.publish('jardin/config', JSON.stringify({time: Math.floor(Date.now()/1000)}));
    });

    client.on('message', (topic, message) => {
        if(topic === 'jardin/temp_log') {
            updateChart(parseFloat(message.toString()));
        }
    });

    function sendManual(pin, state) {
        const cmd = {}; cmd[pin] = state;
        client.publish('jardin/manual', JSON.stringify(cmd));
    }

    function crearPrograma() {
        const p = { slot: programas.length, h: 12, m: 0, v6: true, v7: false, v9: false, active: true };
        programas.push(p);
        save();
    }

    function save() {
        localStorage.setItem('programas', JSON.stringify(programas));
        render();
        // Enviar al Arduino cada programa
        programas.forEach(p => client.publish('jardin/config', JSON.stringify(p)));
    }

    function render() {
        const div = document.getElementById('listaProgramas');
        div.innerHTML = programas.map((p, i) => `
            <div>
                Prog ${i}: <input type="time" value="${p.h}:${p.m}" onchange="programas[${i}].h=this.value.split(':')[0]; save()">
                Activo: <input type="checkbox" ${p.active?'checked':''} onchange="programas[${i}].active=this.checked; save()">
                <button onclick="programas.splice(${i},1); save()">Eliminar</button>
            </div>
        `).join('');
    }

    // Gráfica Chart.js
    const ctx = document.getElementById('tempChart');
    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: historyTemp.map(d => d.t),
            datasets: [{ label: 'Temp últimas 24h', data: historyTemp.map(d => d.v), borderColor: '#2196F3' }]
        }
    });

    function updateChart(val) {
        const now = new Date().toLocaleTimeString();
        historyTemp.push({t: now, v: val});
        if(historyTemp.length > 48) historyTemp.shift(); // 24h / 30min = 48 puntos
        localStorage.setItem('historyTemp', JSON.stringify(historyTemp));
        chart.data.labels = historyTemp.map(d => d.t);
        chart.data.datasets[0].data = historyTemp.map(d => d.v);
        chart.update();
    }

    render();
</script>
</body>
</html>
