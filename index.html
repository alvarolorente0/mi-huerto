<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RiegoSmart PRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        body { background: #0b0e11; color: #e9ecef; font-family: 'Segoe UI', sans-serif; }
        .card-custom { background: #1a1d21; border: 1px solid #343a40; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .bg-offline { background: #ff4757; box-shadow: 0 0 8px #ff4757; }
        .bg-online { background: #2ed573; box-shadow: 0 0 8px #2ed573; }
        .bg-connecting { background: #ffa502; box-shadow: 0 0 8px #ffa502; }
        /* ... (resto de estilos iguales al anterior) ... */
        .btn-mode { border: 1px solid #495057; color: #adb5bd; width: 100%; margin-bottom: 5px; }
        .btn-mode.active-on { background: #28a745; color: white; border-color: #28a745; }
        .btn-mode.active-off { background: #dc3545; color: white; border-color: #dc3545; }
        .btn-mode.active-auto { background: #007bff; color: white; border-color: #007bff; }
        .day-check { display: none; }
        .day-label { cursor: pointer; padding: 5px 10px; border: 1px solid #444; border-radius: 5px; font-size: 12px; }
        .day-check:checked + .day-label { background: #00f2ff; color: #000; }
    </style>
</head>
<body class="container py-4">
    <!-- BARRA DE ESTADO -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-info m-0">RIEGOSMART <small class="text-muted">v2.1</small></h2>
        <div class="card-custom py-2 px-3 m-0">
            <span id="conn-dot" class="status-dot bg-offline"></span>
            <span id="conn-text" class="small">Desconectado</span>
        </div>
    </div>

    <div class="row">
        <div class="col-md-4"><div id="valves-container"></div></div>
        <div class="col-md-8">
            <div class="card-custom">
                <div class="d-flex justify-content-between mb-3">
                    <h5>Programas Semanales</h5>
                    <button class="btn btn-sm btn-outline-info" onclick="addProgram()">+ Nuevo</button>
                </div>
                <div id="programList"></div>
            </div>
        </div>
    </div>

    <script>
        const BROKER = "wss://4f497890d218456aa4de0965d267c8e9.s1.eu.hivemq.cloud:8884/mqtt";
        const client = mqtt.connect(BROKER, { 
            username: 'mqtt_user', 
            password: 'Mqtt_user1',
            clientId: 'WebDashboard_' + Math.random().toString(16).substr(2, 8)
        });

        const dot = document.getElementById('conn-dot');
        const txt = document.getElementById('conn-text');

        // GESTIÓN DE ESTADOS DE CONEXIÓN
        client.on('connect', () => {
            dot.className = "status-dot bg-online";
            txt.innerText = "HiveMQ Online";
            console.log("Conectado a HiveMQ");
        });

        client.on('reconnect', () => {
            dot.className = "status-dot bg-connecting";
            txt.innerText = "Reconectando...";
        });

        client.on('close', () => {
            dot.className = "status-dot bg-offline";
            txt.innerText = "Desconectado";
        });

        // (Resto de la lógica de programas y válvulas del mensaje anterior...)
        let programs = JSON.parse(localStorage.getItem('riego_progs')) || [];
        let valveModes = [0, 0, 0];

        const vContainer = document.getElementById('valves-container');
        for(let i=1; i<=3; i++) {
            vContainer.innerHTML += `
                <div class="card-custom text-center">
                    <h6>Válvula ${i}</h6>
                    <div class="btn-group-vertical w-100">
                        <button id="v${i}-on" onclick="setMode(${i}, 1)" class="btn btn-mode">ON</button>
                        <button id="v${i}-off" onclick="setMode(${i}, 0)" class="btn btn-mode active-off">OFF</button>
                        <button id="v${i}-auto" onclick="setMode(${i}, 2)" class="btn btn-mode">AUTO</button>
                    </div>
                </div>`;
        }

        function setMode(v, modo) {
            valveModes[v-1] = modo;
            ['on', 'off', 'auto'].forEach(m => document.getElementById(`v${v}-${m}`).classList.remove('active-on', 'active-off', 'active-auto'));
            const suffix = modo === 1 ? 'on' : modo === 0 ? 'off' : 'auto';
            document.getElementById(`v${v}-${suffix}`).classList.add('active-' + suffix);
            client.publish('riego/control', JSON.stringify({v: v, modo: modo}));
        }

        function addProgram() {
            programs.push({ id: Date.now(), days: [1], start: "08:00", end: "08:10", valves: [true, false, false] });
            renderPrograms();
        }

        function renderPrograms() {
            const list = document.getElementById('programList');
            list.innerHTML = '';
            programs.forEach((p, idx) => {
                list.innerHTML += `
                    <div class="card-custom mb-2 border-secondary">
                        <div class="row g-2 align-items-center">
                            <div class="col-12 mb-2">
                                ${['D','L','M','X','J','V','S'].map((d, i) => `
                                    <input type="checkbox" class="day-check" id="d-${idx}-${i}" ${p.days.includes(i)?'checked':''} onchange="updateProg(${idx}, 'days', ${i})">
                                    <label class="day-label" for="d-${idx}-${i}">${d}</label>
                                `).join('')}
                            </div>
                            <div class="col-md-3"><input type="time" value="${p.start}" class="form-control form-control-sm bg-dark text-white" onchange="updateProg(${idx}, 'start', this.value)"></div>
                            <div class="col-md-3"><input type="time" value="${p.end}" class="form-control form-control-sm bg-dark text-white" onchange="updateProg(${idx}, 'end', this.value)"></div>
                            <div class="col-md-4 text-center">
                                ${[0,1,2].map(v => `
                                    <button class="btn btn-xs ${p.valves[v]?'btn-primary':'btn-outline-secondary'}" style="font-size:10px" onclick="toggleProgValve(${idx}, ${v})">V${v+1}</button>
                                `).join('')}
                            </div>
                            <div class="col-md-2"><button class="btn btn-danger btn-sm w-100" onclick="removeProg(${idx})">🗑</button></div>
                        </div>
                    </div>`;
            });
            localStorage.setItem('riego_progs', JSON.stringify(programs));
        }

        setInterval(() => {
            const now = new Date();
            const day = now.getDay();
            const time = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            let auto_exec = [false, false, false];
            programs.forEach(p => {
                if(p.days.includes(day) && time >= p.start && time < p.end) {
                    p.valves.forEach((vActive, i) => { if(vActive) auto_exec[i] = true; });
                }
            });
            if(client.connected) client.publish('riego/control', JSON.stringify({auto_exec: auto_exec}));
        }, 5000);

        function updateProg(idx, key, val) {
            if(key === 'days') {
                const pos = programs[idx].days.indexOf(val);
                pos === -1 ? programs[idx].days.push(val) : programs[idx].days.splice(pos, 1);
            } else { programs[idx][key] = val; }
            renderPrograms();
        }
        function toggleProgValve(idx, vIdx) { programs[idx].valves[vIdx] = !programs[idx].valves[vIdx]; renderPrograms(); }
        function removeProg(idx) { programs.splice(idx, 1); renderPrograms(); }
        renderPrograms();
    </script>
</body>
</html>
