<head>

    <title>SISTEMA DE RIEGO - MKR1000 PRO</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        :root { --neon: #00d4ff; --bg: #050505; --card: #121212; --off: #444; --led-on: #00ffaa; }
        body { background-color: var(--bg); color: var(--neon); font-family: 'Segoe UI', sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        .hero-temp { text-align: center; padding: 30px; margin-bottom: 20px; background: radial-gradient(circle, #1a1a1a 0%, #050505 100%); border: 2px solid var(--neon); border-radius: 20px; }
        .temp-val { font-size: 5.5rem; font-weight: 900; margin: 10px 0; }
        .card { background: var(--card); border: 1px solid #222; border-radius: 15px; padding: 18px; margin-bottom: 20px; }
        h2 { font-size: 0.8rem; letter-spacing: 2px; color: #666; text-transform: uppercase; }
        .ev-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
        .ev-item { background: #000; padding: 20px; border-radius: 12px; border: 1px solid #222; text-align: center; }
        .valve-icon { width: 45px; height: 45px; fill: var(--off); transition: 0.5s; }
        .valve-icon.active { fill: var(--neon); filter: drop-shadow(0 0 8px var(--neon)); }
        .status-led { width: 8px; height: 8px; border-radius: 50%; background-color: #222; margin: 10px auto; }
        .status-led.on { background-color: var(--led-on); box-shadow: 0 0 10px var(--led-on); }
        .group-btn { display: flex; justify-content: center; gap: 4px; margin-top: 10px; }
        .btn { flex: 1; padding: 8px 2px; cursor: pointer; background: #111; border: 1px solid #333; color: #555; border-radius: 4px; font-size: 0.6rem; font-weight: bold; }
        .btn.active-on { border-color: var(--led-on); color: var(--led-on); }
        .btn.active-auto { border-color: var(--neon); color: var(--neon); }
        .btn.active-off { border-color: #ff4444; color: #ff4444; }
        .prog-row { background: #151515; padding: 10px; border-radius: 8px; margin-bottom: 5px; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; }
        .btn-add { width: 100%; border: 1px dashed var(--neon); color: var(--neon); background: transparent; padding: 10px; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    </style>
</head>

    </div>

    <div class="card">
        <canvas id="tempChart" style="max-height: 120px;"></canvas>
    </div>
