<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE RIEGO - MKR1000</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --neon: #00d4ff; --bg: #050505; --card: #0f0f0f; }
        body { 
            background-color: var(--bg); color: var(--neon); 
            font-family: 'Segoe UI', sans-serif; padding: 20px; max-width: 900px; margin: auto; 
        }
        
        /* Temperatura Hero */
        .temp-display {
            text-align: center; padding: 40px; margin-bottom: 25px;
            background: linear-gradient(145deg, #0a0a0a, #151515);
            border: 3px solid var(--neon); border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.15);
        }
        .temp-val { font-size: 5rem; font-weight: 800; text-shadow: 0 0 20px var(--neon); }
        .temp-unit { font-size: 2rem; vertical-align: super; }

        .card { 
            background: var(--card); border: 1px solid rgba(0, 212, 255, 0.3); 
            border-radius: 12px; padding: 20px; margin-bottom: 25px; 
        }
        h2 { border-bottom: 1px solid var(--neon); padding-bottom: 10px; margin-top: 0; font-size: 1rem; letter-spacing: 2px; }

        /* Controles Manuales */
        .ev-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .ev-item { background: #1a1a1a; padding: 15px; border-radius: 8px; text-align: center; }
        
        /* Botones y Selectores */
        .group-btn { display: flex; justify-content: center; gap: 5px; margin-top: 10px; }
        .btn { 
            padding: 8px 12px; cursor: pointer; background: transparent; 
            border: 1px solid var(--neon); color: var(--neon); border-radius: 4px; transition: 0.3s;
        }
        .btn.active { background: var(--neon); color: #000; box-shadow: 0 0 10px var(--neon); }
        .btn-add { width: 100%; padding: 12px; margin-top: 10px; font-weight: bold; border-style: dashed; }

        /* Desplegable de Programación */
        details { background: #111; border: 1px solid #333; border-radius: 8px; margin-bottom: 10px; }
        summary { padding: 15px; cursor: pointer; font-weight: bold; outline: none; }
        .prog-content { padding: 15px; border-top: 1px solid #333; display: grid; gap: 15px; }
        
        .days-selector label { margin-right: 8px; font-size: 0.8rem; }
        .valve-selector label { margin-right: 15px; color: #fff; }
        input[type="time"] { background: #222; border: 1px solid var(--neon); color: var(--neon); padding: 5px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="temp-display">
        <h2>TEMPERATURA ACTUAL</h2>
        <div class="temp-val"><span id="bigTemp">--.-</span><span class="temp-unit">°C</span></div>
    </div>

    <div class="card">
        <h2>CONTROL MANUAL (EV)</h2>
        <div class="ev-grid">
            <div class="ev-item">
                <div>EV 1 (PIN 6)</div>
                <div class="group-btn" id="ctrl-6">
                    <button class="btn" onclick="sendManual(6, 1)">ON</button>
                    <button class="btn" onclick="sendManual(6, 0)">OFF</button>
                    <button class="btn active" onclick="sendManual(6, 2)">AUTO</button>
                </div>
            </div>
            <div class="ev-item">
                <div>EV 2 (PIN 7)</div>
                <div class="group-btn" id="ctrl-7">
                    <button class="btn" onclick="sendManual(7, 1)">ON</button>
                    <button class="btn" onclick="sendManual(7, 0)">OFF</button>
                    <button class="btn active" onclick="sendManual(7, 2)">AUTO</button>
                </div>
            </div>
            <div class="ev-item">
                <div>EV 3 (PIN 9)</div>
                <div class="group-btn" id="ctrl-9">
                    <button class="btn" onclick="sendManual(9, 1)">ON</button>
                    <button class="btn" onclick="sendManual(9, 0)">OFF</button>
                    <button class="btn active" onclick="sendManual(9, 2)">AUTO</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>PLANIFICADOR DE RIEGO</h2>
        <div id="listaProgramas"></div>
        <button class="btn btn-add" onclick="crearPrograma()">+ NUEVO PROGRAMA</button>
    </div>

    <div class="card">
        <h2>HISTORIAL TÉRMICO</h2>
        <canvas id="tempChart" style="max-height: 250px;"></canvas>
    </div>

<script>
    const broker = 'wss://TU_ID.s1.eu.hivemq.cloud:8884/mqtt';
    const client = mqtt.connect(broker, { username: 'TU_USUARIO', password: 'TU_PASSWORD' });

    let programas = JSON.parse(localStorage.getItem('riego_data')) || [];
    let logs = JSON.parse(localStorage.getItem('temp_logs')) || [];

    // --- COMUNICACIÓN ---
    client.on('connect', () => client.subscribe('jardin/temp_log'));
    client.on('message', (topic, msg) => {
        if(topic === 'jardin/temp_log') {
            const val = parseFloat(msg.toString());
            document.getElementById('bigTemp').innerText = val.toFixed(1);
            updateChart(val);
        }
    });

    function sendManual(pin, val) {
        // Estética de botones
        const btns = document.querySelectorAll(`#ctrl-${pin} .btn`);
        btns.forEach((b, i) => b.classList.toggle('active', i === (val === 1 ? 0 : val === 0 ? 1 : 2)));
        
        client.publish('jardin/manual', JSON.stringify({pin, val}));
    }

    // --- LÓGICA PROGRAMAS ---
    function crearPrograma() {
        const p = {
            id: Date.now(),
            inicio: "08:00",
            fin: "08:15",
            valvulas: [6],
            dias: [1,2,3,4,5]
        };
        programas.push(p);
        actualizarTodo();
    }

    function actualizarTodo() {
        localStorage.setItem('riego_data', JSON.stringify(programas));
        renderProgramas();
        client.publish('jardin/config', JSON.stringify(programas));
    }

    function toggleDia(id, dia) {
        const p = programas.find(x => x.id === id);
        if(p.dias.includes(dia)) p.dias = p.dias.filter(d => d !== dia);
        else p.dias.push(dia);
        actualizarTodo();
    }

    function toggleValvula(id, pin) {
        const p = programas.find(x => x.id === id);
        if(p.valvulas.includes(pin)) p.valvulas = p.valvulas.filter(v => v !== pin);
        else p.valvulas.push(pin);
        actualizarTodo();
    }

    function renderProgramas() {
        const cont = document.getElementById('listaProgramas');
        const diasSemana = ['D','L','M','X','J','V','S'];
        const pins = [6, 7, 9];

        cont.innerHTML = programas.map(p => `
            <details>
                <summary>Programa: ${p.inicio} - ${p.fin} (EV: ${p.valvulas.join(',')})</summary>
                <div class="prog-content">
                    <div>
                        Inicio: <input type="time" value="${p.inicio}" onchange="programas.find(x=>x.id==${p.id}).inicio=this.value; actualizarTodo()">
                        Fin: <input type="time" value="${p.fin}" onchange="programas.find(x=>x.id==${p.id}).fin=this.value; actualizarTodo()">
                    </div>
                    <div class="valve-selector">
                        Electroválvulas: 
                        ${pins.map(pin => `
                            <label><input type="checkbox" ${p.valvulas.includes(pin)?'checked':''} onchange="toggleValvula(${p.id}, ${pin})"> EV${pins.indexOf(pin)+1}</label>
                        `).join('')}
                    </div>
                    <div class="days-selector">
                        Días: 
                        ${diasSemana.map((d, i) => `
                            <label><input type="checkbox" ${p.dias.includes(i)?'checked':''} onchange="toggleDia(${p.id}, ${i})"> ${d}</label>
                        `).join('')}
                    </div>
                    <button class="btn" style="color:#ff4444; border-color:#ff4444" onclick="programas=programas.filter(x=>x.id!=${p.id}); actualizarTodo()">ELIMINAR</button>
                </div>
            </details>
        `).join('');
    }

    // --- GRÁFICA ---
    const ctx = document.getElementById('tempChart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: logs.map(l => l.t),
            datasets: [{
                label: 'Temperatura °C',
                data: logs.map(l => l.v),
                borderColor: '#00d4ff',
                backgroundColor: 'rgba(0, 212, 255, 0.1)',
                fill: true, tension: 0.3, pointRadius: 2
            }]
        },
        options: { 
            scales: { 
                y: { grid: {color:'#222'}, ticks: {color: '#00d4ff'} },
                x: { grid: {display:false}, ticks: {color: '#00d4ff'} }
            },
            plugins: { legend: { display: false } }
        }
    });

    function updateChart(val) {
        const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        logs.push({t: time, v: val});
        if(logs.length > 30) logs.shift();
        localStorage.setItem('temp_logs', JSON.stringify(logs));
        chart.data.labels = logs.map(l => l.t);
        chart.data.datasets[0].data = logs.map(l => l.v);
        chart.update('none');
    }

    renderProgramas();
</script>
</body>
</html>
