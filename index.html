<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huerto Pro - Panel Estilo Grafana</title>
    
    <!-- Librerías Externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2937;
            --text-color: #d1d5db;
            --accent: #38bdf8;
            --on-color: #22c55e;
            --off-color: #ef4444;
            --auto-color: #eab308;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color);
            margin: 0; padding: 20px;
        }

        .dashboard { max-width: 1000px; margin: auto; display: grid; gap: 20px; }

        /* Estilo Grafana Card */
        .card { 
            background: var(--card-bg); 
            border-radius: 8px; 
            padding: 20px; 
            border-top: 3px solid var(--accent);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        h2 { font-size: 1.2rem; margin-top: 0; color: var(--accent); display: flex; align-items: center; gap: 10px; }

        /* Controles EV y Abono */
        .control-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        
        .device-row { display: flex; align-items: center; justify-content: space-between; background: #111827; padding: 15px; border-radius: 6px; }
        
        .btn-group { display: flex; gap: 5px; }
        
        button { 
            padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; 
            font-weight: bold; background: #374151; color: #9ca3af; transition: 0.3s;
        }

        button.active.on { background: var(--on-color); color: white; }
        button.active.off { background: var(--off-color); color: white; }
        button.active.auto { background: var(--auto-color); color: black; }

        /* Gráfica */
        .chart-container { height: 300px; width: 100%; }

        /* Programador */
        input, select { 
            background: #111827; border: 1px solid #374151; color: white; 
            padding: 8px; border-radius: 4px; margin: 5px;
        }

        .prog-list { margin-top: 15px; border-collapse: collapse; width: 100%; font-size: 0.9rem; }
        .prog-list th { text-align: left; border-bottom: 1px solid #374151; padding: 10px; }
        .prog-list td { padding: 10px; border-bottom: 1px solid #111827; }

        #status { font-size: 0.8rem; text-align: right; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="dashboard">
    <div id="status">🔌 Conectando al broker...</div>

    <!-- SECCIÓN CONTROLES -->
    <div class="card">
        <h2><i class="fas fa-microchip"></i> Panel de Control</h2>
        <div class="control-grid">
            <!-- EV1 -->
            <div class="device-row">
                <span><i class="fas fa-faucet"></i> EV1</span>
                <div class="btn-group" id="group-ev1">
                    <button onclick="setMode('ev1', 'OFF')">OFF</button>
                    <button onclick="setMode('ev1', 'AUTO')">AUTO</button>
                    <button onclick="setMode('ev1', 'ON')">ON</button>
                </div>
            </div>
            <!-- EV2 -->
            <div class="device-row">
                <span><i class="fas fa-faucet"></i> EV2</span>
                <div class="btn-group" id="group-ev2">
                    <button onclick="setMode('ev2', 'OFF')">OFF</button>
                    <button onclick="setMode('ev2', 'AUTO')">AUTO</button>
                    <button onclick="setMode('ev2', 'ON')">ON</button>
                </div>
            </div>
            <!-- ABONO -->
            <div class="device-row">
                <span><i class="fas fa-seedling"></i> ABONO</span>
                <div class="btn-group" id="group-abno">
                    <button onclick="setMode('abno', 'OFF')">OFF</button>
                    <button onclick="setMode('abno', 'AUTO')">AUTO</button>
                    <button onclick="setMode('abno', 'ON')">ON</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SECCIÓN GRÁFICA -->
    <div class="card">
        <h2><i class="fas fa-chart-line"></i> Temperatura (Histórico 30 min)</h2>
        <div class="chart-container">
            <canvas id="tempChart"></canvas>
        </div>
    </div>

    <!-- SECCIÓN PROGRAMADOR -->
    <div class="card">
        <h2><i class="fas fa-calendar-alt"></i> Crear Programa</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 10px;">
            <input type="time" id="prog-hora">
            <select id="prog-dia">
                <option value="Diario">Diario</option>
                <option value="Lunes">Lunes</option>
                <option value="Martes">Martes</option>
                <option value="Miércoles">Miércoles</option>
                <option value="Jueves">Jueves</option>
                <option value="Viernes">Viernes</option>
                <option value="Sábado">Sábado</option>
                <option value="Domingo">Domingo</option>
            </select>
            <select id="prog-sector">
                <option value="EV1">EV1</option>
                <option value="EV2">EV2</option>
                <option value="ABONO">ABONO</option>
            </select>
            <button class="active on" onclick="addProgram()">+ Añadir</button>
        </div>

        <table class="prog-list">
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Día</th>
                    <th>Sector</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="prog-body">
                <!-- Se llenará dinámicamente -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const TOPIC_PREFIX = "CVH_HUERTO";
    let programas = [];

    // --- CONFIGURACIÓN MQTT ---
    const client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "/mqtt", "user_" + Math.random());
    
    client.connect({
        useSSL: true,
        onSuccess: () => {
            document.getElementById('status').innerHTML = "🟢 Sistema Online";
            client.subscribe(TOPIC_PREFIX + "/telemetria/temp");
        },
        onFailure: (e) => { document.getElementById('status').innerHTML = "❌ Error: " + e.errorMessage; }
    });

    client.onMessageArrived = (msg) => {
        if(msg.destinationName.includes("temp")) {
            updateChart(parseFloat(msg.payloadString));
        }
    };

    // --- LÓGICA DE BOTONES (MODOS) ---
    function setMode(device, mode) {
        // Enviar vía MQTT el modo elegido
        const message = new Paho.MQTT.Message(mode);
        message.destinationName = `${TOPIC_PREFIX}/modo/${device}`;
        client.send(message);

        // Actualizar UI
        const buttons = document.querySelectorAll(`#group-${device} button`);
        buttons.forEach(btn => {
            btn.classList.remove('active', 'on', 'off', 'auto');
            if(btn.innerText === mode) {
                btn.classList.add('active', mode.toLowerCase());
            }
        });
    }

    // --- LÓGICA DE LA GRÁFICA ---
    const ctx = document.getElementById('tempChart').getContext('2d');
    const tempChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: 'Temperatura °C',
                data: [],
                borderColor: '#38bdf8',
                backgroundColor: 'rgba(56, 189, 248, 0.1)',
                fill: true,
                tension: 0.4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: { grid: { color: '#374151' }, ticks: { color: '#9ca3af' } },
                x: { grid: { color: '#374151' }, ticks: { color: '#9ca3af' } }
            },
            plugins: { legend: { display: false } }
        }
    });

    function updateChart(val) {
        const now = new Date();
        const timeLabel = now.getHours() + ":" + now.getMinutes().toString().padStart(2, '0');
        
        // Simular guardado cada 30 min (para la demo añadimos cada vez que llega dato)
        tempChart.data.labels.push(timeLabel);
        tempChart.data.datasets[0].data.push(val);
        
        if(tempChart.data.labels.length > 20) {
            tempChart.data.labels.shift();
            tempChart.data.datasets[0].data.shift();
        }
        tempChart.update();
    }

    // --- LÓGICA DEL PROGRAMADOR ---
    function addProgram() {
        const hora = document.getElementById('prog-hora').value;
        const dia = document.getElementById('prog-dia').value;
        const sector = document.getElementById('prog-sector').value;

        if(!hora) return alert("Elige una hora");

        const nuevoProg = { id: Date.now(), hora, dia, sector, activo: true };
        programas.push(nuevoProg);
        renderProgramas();
        
        // Aquí podrías enviar el array de programas por MQTT para que el ESP32 los guarde
        const msg = new Paho.MQTT.Message(JSON.stringify(programas));
        msg.destinationName = TOPIC_PREFIX + "/config/programas";
        msg.retained = true;
        client.send(msg);
    }

    function toggleProg(id) {
        const p = programas.find(x => x.id === id);
        p.activo = !p.activo;
        renderProgramas();
    }

    function deleteProg(id) {
        programas = programas.filter(x => x.id !== id);
        renderProgramas();
    }

    function renderProgramas() {
        const tbody = document.getElementById('prog-body');
        tbody.innerHTML = "";
        programas.forEach(p => {
            tbody.innerHTML += `
                <tr>
                    <td>${p.hora}</td>
                    <td>${p.dia}</td>
                    <td>${p.sector}</td>
                    <td>
                        <button class="${p.activo ? 'active on' : ''}" onclick="toggleProg(${p.id})">
                            ${p.activo ? 'ACTIVO' : 'PAUSA'}
                        </button>
                    </td>
                    <td><button onclick="deleteProg(${p.id})"><i class="fas fa-trash"></i></button></td>
                </tr>
            `;
        });
    }
</script>

</body>
</html>
